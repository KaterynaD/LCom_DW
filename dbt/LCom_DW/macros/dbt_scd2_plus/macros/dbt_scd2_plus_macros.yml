version: 2

macros:
  - name: scd2_plus_build_table_sql
    description: |
      Internal helper macro used by the `scd2_plus` materialization to transform the
      source SELECT into a fully prepared SCD2 result set. It:
      - de-duplicates rows per (unique_key, updated_at, loaded_at)
      - computes SCD hashes and IDs
      - derives valid_from / valid_to ranges and record_version
      - applies Type I (punch_thru_cols) and update_cols rules
      - adds SCD service columns (loaddate, updatedate, scd_hash, etc.)
      The same macro is used both for initial table creation and for incremental loads.
    arguments:
      - name: config
        description: |
          Model configuration dictionary (read from `model['config']`). Must include:
          - unique_key (string expression)
          - updated_at (timestamp expression)
          - check_cols (list of column names to track as Type II)
          Optional keys:
          - loaded_at
          - punch_thru_cols
          - update_cols
          - loaddate
          - scd_id_col_name
          - scd_valid_from_col_name
          - scd_valid_to_col_name
          - scd_record_version_col_name
          - scd_loaddate_col_name
          - scd_updatedate_col_name
          - scd_valid_from_min_date
          - scd_valid_to_max_date
      - name: sql
        type: string
        description: |
          Compiled SELECT statement for the source (non-SCD) dataset, usually
          `model['compiled_code']`.
      - name: create_flg
        type: bool
        description: |
          When true, applies `scd_valid_from_min_date` to the first record version
          (for initial table creation). When false, uses the raw valid_from value
          (for incremental loads).


  - name: scd2_plus_merge_sql
    description: |
      Internal helper macro used by the `scd2_plus` materialization to merge new
      data into an existing SCD2 table. It:
      - builds new SCD2 rows via `scd2_plus_build_table_sql`
      - stages new/changed rows in a temporary table
      - inserts new history versions
      - updates existing versions when duplicates exist for the same key/timestamp
      - recalculates valid_from / valid_to / record_version for back-dated changes
      - applies Type I punch_thru_cols and update_cols across existing rows
    arguments:
      - name: target
        type: relation
        description: Existing SCD2 target relation (the dimension table).
      - name: config
        description: |
          Same configuration dictionary as in `scd2_plus_build_table_sql`, read from
          the model config (unique_key, updated_at, check_cols, and optional fields).
      - name: sql
        type: string
        description: |
          Compiled SELECT statement for the source (non-SCD) dataset, usually
          `model['compiled_code']`.

  - name: is_scd2_update_run
    description: |
      Returns a boolean indicating whether the current `scd2_plus` execution should
      run as an incremental update. It returns true only when:
      - execution context is active (`execute`)
      - the target relation already exists and is a table
      - a full refresh is not requested

  - name: print_scd_hash
    description: |
      Debug utility macro that prints and returns the compiled SCD hash SQL expression
      for a model's `check_cols` configuration.
    arguments:
      - name: model_name
        type: string
        description: Name of the dbt model to inspect.

  - name: collapse_consecutive_scd_hash
    description: |
      Maintenance macro that collapses consecutive SCD2 rows with the same `scd_hash`
      for each business key, then rebuilds record versions and validity ranges.
      Useful for cleaning up duplicate adjacent history versions.
    arguments:
      - name: model_name
        type: string
        description: Name of the SCD2 model table to clean up.
      - name: unique_key
        type: string
        description: Business key column used to partition history.
      - name: scd_valid_from_col_name
        type: string
        description: Valid-from column name (defaults to `from`).
      - name: scd_valid_to_col_name
        type: string
        description: Valid-to column name (defaults to `to`).
      - name: scd_record_version_col_name
        type: string
        description: Record version column name (defaults to `record_version`).



