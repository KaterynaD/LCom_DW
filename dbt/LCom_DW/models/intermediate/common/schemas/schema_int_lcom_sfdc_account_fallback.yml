version: 2

models:
  - name: int_lcom_sfdc_account_fallback
    description: >
      One fallback Salesforce account per normalized LCOM platform organization ID.
      It is used by int_lcom_sfdc_account_mapping_base when an organization has no valid direct Salesforce ID.
    config:
      tags:
        - common
        - staging
    columns:
      - name: organization_id
      - name: salesforce_id
