version: 2

unit_tests:
  # TEST 1
  # Validates TRUE ARR logic:
  # start_date must shift to invoiced_date when invoiced_date > start_date
  - name: int_arr_base_true_shifts_start_date_to_invoiced_date_when_later
    model: int_arr_base
    given:
      - input: ref('int_arr_initial')
        format: dict
        rows:
          - {ARR_Type: 'True', HasParent: false, opportunity_id: 'OPP_TRUE_1', stage_name: 'Closed Won', account_id: 'ACC_1', state_code: 'CA', invoiced_date: '2026-03-10', close_date: '2026-03-05', start_date: '2026-03-01', end_date: '2027-02-28', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_1', bucket: 'Sales : New Business : ARR', total_price: 1200, parent_total_price: 0, max_parent_end_date: '1900-01-01'}
      - input: ref('dim_month')
        format: dict
        rows:
          - {mon_firstday: '2026-03-01', mon_lastday: '2026-03-31', mon_year: 202603, fiscalyear: 'FY2026', fiscalyear_mon: 9}
    expect:
      rows:
        - {ARR_Type: 'True', opportunity_id: 'OPP_TRUE_1', mon_year: 202603, start_date: '2026-03-10', start_date_sfdc: '2026-03-01'}

  # TEST 2
  # Validates BACKDATED ARR logic:
  # start_date remains SFDC start_date and arr_activation_date = invoiced_date
  - name: int_arr_base_backdated_keeps_sfdc_start_date_and_sets_activation_date
    model: int_arr_base
    given:
      - input: ref('int_arr_initial')
        format: dict
        rows:
          - {ARR_Type: 'Backdated', HasParent: false, opportunity_id: 'OPP_BACKDATED_1', stage_name: 'Closed Won', account_id: 'ACC_2', state_code: 'CA', invoiced_date: '2026-03-10', close_date: '2026-03-05', start_date: '2026-03-01', end_date: '2027-02-28', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_2', bucket: 'Sales : New Business : ARR', total_price: 900, parent_total_price: 0, max_parent_end_date: '1900-01-01'}
      - input: ref('dim_month')
        format: dict
        rows:
          - {mon_firstday: '2026-03-01', mon_lastday: '2026-03-31', mon_year: 202603, fiscalyear: 'FY2026', fiscalyear_mon: 9}
    expect:
      rows:
        - {ARR_Type: 'Backdated', opportunity_id: 'OPP_BACKDATED_1', mon_year: 202603, start_date: '2026-03-01', start_date_sfdc: '2026-03-01', arr_activation_date: '2026-03-10'}

  # TEST 3
  # Validates PRELIMINARY TX grace-period end_date logic:
  # end_date extends with TX grace-period and renewal_start_date uses renewal invoiced date
  - name: int_arr_base_preliminary_uses_tx_grace_period_when_earlier_than_renewal_cutoff
    model: int_arr_base
    given:
      - input: ref('int_arr_initial')
        format: dict
        rows:
          - {ARR_Type: 'Preliminary', HasParent: false, opportunity_id: 'OPP_PRE_TX_1', stage_name: 'Closed Won', account_id: 'ACC_3', state_code: 'TX', invoiced_date: '2026-01-05', close_date: '2026-01-02', start_date: '2026-01-01', end_date: '2026-01-31', renewal_opportunity_id: 'OPP_REN_1', renewal_stage_name: 'Closed Won', renewal_invoiced_date: '2026-06-15', renewal_close_date: '2026-06-10', renewal_start_date: '2026-06-01', renewal_end_date: '2027-05-31', sfdc_product_id: 'PROD_3', bucket: 'Sales : Renewal : ARR', total_price: 500, parent_total_price: 450, max_parent_end_date: '1900-01-01'}
      - input: ref('dim_month')
        format: dict
        rows:
          - {mon_firstday: '2026-01-01', mon_lastday: '2026-01-31', mon_year: 202601, fiscalyear: 'FY2026', fiscalyear_mon: 7}
    expect:
      rows:
        - {ARR_Type: 'Preliminary', opportunity_id: 'OPP_PRE_TX_1', mon_year: 202601, end_date: '2026-05-01', end_date_sfdc: '2026-01-31', renewal_start_date: '2026-06-15', renewal_start_date_sfdc: '2026-06-01'}

  # TEST 4
  # Validates fallback logic:
  # when renewal_start_date is missing, renewal_start_date defaults to end_date + 1 day
  - name: int_arr_base_defaults_renewal_start_date_to_day_after_end_date_when_missing
    model: int_arr_base
    given:
      - input: ref('int_arr_initial')
        format: dict
        rows:
          - {ARR_Type: 'True', HasParent: false, opportunity_id: 'OPP_TRUE_2', stage_name: 'Closed Won', account_id: 'ACC_4', state_code: 'CA', invoiced_date: '2026-02-01', close_date: '2026-01-30', start_date: '2026-02-01', end_date: '2026-02-28', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_4', bucket: 'Sales : New Business : ARR', total_price: 300, parent_total_price: 0, max_parent_end_date: '1900-01-01'}
      - input: ref('dim_month')
        format: dict
        rows:
          - {mon_firstday: '2026-02-01', mon_lastday: '2026-02-28', mon_year: 202602, fiscalyear: 'FY2026', fiscalyear_mon: 8}
    expect:
      rows:
        - {opportunity_id: 'OPP_TRUE_2', mon_year: 202602, renewal_start_date: '2026-03-01', renewal_start_date_sfdc: '1900-01-01'}

  # TEST 5
  # Validates placeholder row creation:
  # for Won Renewals, an additional placeholder row must be generated
  - name: int_arr_base_creates_placeholder_row_for_parented_non_lost_opportunity
    model: int_arr_base
    given:
      - input: ref('int_arr_initial')
        format: dict
        rows:
          - {ARR_Type: 'True', HasParent: true, opportunity_id: 'OPP_PLACEHOLDER_1', stage_name: 'Closed Won', account_id: 'ACC_5', state_code: 'CA', invoiced_date: '2026-03-01', close_date: '2026-02-27', start_date: '2026-03-01', end_date: '2027-02-28', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_5', bucket: 'Sales : Renewal : ARR', total_price: 1000, parent_total_price: 800, max_parent_end_date: '2026-02-28'}
      - input: ref('dim_month')
        format: dict
        rows:
          - {mon_firstday: '2026-03-01', mon_lastday: '2026-03-31', mon_year: 202603, fiscalyear: 'FY2026', fiscalyear_mon: 9}
    expect:
      rows:
        - {opportunity_id: 'OPP_PLACEHOLDER_1', mon_year: 202603, bucket: 'Sales : Renewal : ARR'}
        - {opportunity_id: 'OPP_PLACEHOLDER_1', mon_year: 202603, bucket: 'Sales : Placeholder for Price Increase or Downsell : ARR'}

  # TEST 6
  # Validates cancellation row creation:
  # for HasParent = true , non 0 parent_total_price and Closed Lost opportunities, a cancellation row must be generated
  - name: int_arr_base_creates_cancellation_row_for_parented_closed_lost_opportunity
    model: int_arr_base
    given:
      - input: ref('int_arr_initial')
        format: dict
        rows:
          - {ARR_Type: 'True', HasParent: true, opportunity_id: 'OPP_CANCEL_1', stage_name: 'Closed Lost', account_id: 'ACC_6', state_code: 'CA', invoiced_date: '1900-01-01', close_date: '2026-04-15', start_date: '2026-04-01', end_date: '2027-03-31', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_6', bucket: 'Sales : Renewal : Biz Dev', total_price: 200, parent_total_price: 150, max_parent_end_date: '2026-03-31'}
      - input: ref('dim_month')
        format: dict
        rows:
          - {mon_firstday: '2026-04-01', mon_lastday: '2026-04-30', mon_year: 202604, fiscalyear: 'FY2026', fiscalyear_mon: 10}
    expect:
      rows:
        - {opportunity_id: 'OPP_CANCEL_1', mon_year: 202604, bucket: 'Sales : Cancellation : Biz Dev'}

  # TEST 7
  # Validates GAP logic driven by max_parent_end_date:
  # if original start_date is before max_parent_end_date + 1 day, start_date must shift forward
  - name: int_arr_base_shifts_start_date_forward_when_gap_with_parent_exists
    model: int_arr_base
    given:
      - input: ref('int_arr_initial')
        format: dict
        rows:
          - {ARR_Type: 'True', HasParent: true, opportunity_id: 'OPP_GAP_1', stage_name: 'Closed Won', account_id: 'ACC_7', state_code: 'CA', invoiced_date: '2026-03-01', close_date: '2026-02-25', start_date: '2026-03-01', end_date: '2027-02-28', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_7', bucket: 'Sales : Renewal : ARR', total_price: 1000, parent_total_price: 800, max_parent_end_date: '2026-03-15'}
