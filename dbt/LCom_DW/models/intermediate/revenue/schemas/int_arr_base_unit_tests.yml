  # Validates PRELIMINARY non-TX, non-Biz Dev grace-period end_date logic:
  # when no earlier renewal cutoff exists, end_date must extend by 60 days
  - name: int_arr_base_preliminary_other_state_uses_60_day_end_date_grace_period
    model: int_arr_base
    given:
      - input: ref('int_arr_initial')
        format: dict
        rows:
          - {ARR_Type: 'Preliminary', HasParent: false, opportunity_id: 'OPP_PRE_OTHER_1', stage_name: 'Closed Won', account_id: 'ACC_10', state_code: 'CA', invoiced_date: '2026-01-10', close_date: '2026-01-08', start_date: '2026-01-01', end_date: '2026-01-31', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_10', bucket: 'Sales : Renewal : ARR', total_price: 450, parent_total_price: 300, max_parent_end_date: '1900-01-01'}
      - input: ref('dim_month')
        format: dict
        rows:
          - {mon_firstday: '2026-01-01', mon_lastday: '2026-01-31', mon_year: 202601, fiscalyear: 'FY2026', fiscalyear_mon: 7}
    expect:
      rows:
        - {opportunity_id: 'OPP_PRE_OTHER_1', mon_year: 202601, end_date: '2026-04-01', end_date_sfdc: '2026-01-31', bucket: 'Sales : Renewal : ARR'}

