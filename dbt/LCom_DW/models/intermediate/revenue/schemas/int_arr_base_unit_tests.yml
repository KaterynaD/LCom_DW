        rows:
          - {mon_firstday: '2026-03-01', mon_lastday: '2026-03-31', mon_year: 202603, fiscalyear: 'FY2026', fiscalyear_mon: 9}
    expect:
      rows:
        - {opportunity_id: 'OPP_GAP_1', bucket: 'Sales : Renewal : ARR', mon_year: 202603, start_date: '2026-03-16', start_date_sfdc: '2026-03-01', max_parent_end_date: '2026-03-15'}
        - {opportunity_id: 'OPP_GAP_1', bucket: 'Sales : Placeholder for Price Increase or Downsell : ARR', mon_year: 202603, start_date: '2026-03-16', start_date_sfdc: '2026-03-01', max_parent_end_date: '2026-03-15'}        

  # TEST 8
  # Validates NO-GAP logic driven by max_parent_end_date:
  # if start_date is already later than max_parent_end_date + 1 day, it must remain unchanged
  - name: int_arr_base_keeps_start_date_when_no_gap_adjustment_needed
    model: int_arr_base
    given:
      - input: ref('int_arr_initial')
        format: dict
        rows:
