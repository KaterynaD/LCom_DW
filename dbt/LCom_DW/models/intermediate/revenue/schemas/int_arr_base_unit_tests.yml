      - input: ref('dim_month')
        format: dict
        rows:
          - {mon_firstday: '2026-02-01', mon_lastday: '2026-02-28', mon_year: 202602, fiscalyear: 'FY2026', fiscalyear_mon: 8}
    expect:
      rows:
        - {opportunity_id: 'OPP_PRE_BIZDEV_PARENT_1', bucket: 'Sales : Renewal : Biz Dev', mon_year: 202602, max_parent_end_date: '2026-07-31', max_parent_end_date_sfdc: '2026-01-31', start_date: '2026-02-01'}
