version: 2

unit_tests:
  # TEST 1
  # Validates starting row creation:
  # invoiced won opportunity active on the day before fiscal month 1 starts must create ARR-Starting
  # and must also create ARR-MonthlyAdded in the month tied to the given start_date
  - name: int_arr_monthly_changes_creates_starting_record_for_active_invoiced_won_opportunity
    model: int_arr_monthly_changes
    given:
      - input: ref('int_arr_base')
        format: dict
        rows:
          - {ARR_Type: 'True', mon_year: 202506, mon_lastday: '2025-06-30', fiscalyear: 'FY2025', fiscalyear_mon: 12, HasParent: false, opportunity_id: 'OPP_START_1', stage_name: 'Closed Won', account_id: 'ACC_1', invoiced_date: '2025-06-15', close_date: '2025-06-10', start_date: '2025-06-15', start_date_sfdc: '2025-06-15', end_date: '2025-12-31', end_date_sfdc: '2025-12-31', arr_activation_date: '2025-06-15', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_start_date_sfdc: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_1', bucket: 'Sales : New Business : ARR', total_price: 1000, parent_total_price: 0, max_parent_end_date: '1900-01-01', max_parent_end_date_sfdc: '1900-01-01'}
      - input: ref('dim_month')
        format: dict
        rows:
          - {mon_firstday: '2025-07-01', mon_lastday: '2025-07-31', mon_year: 202507, fiscalyear: 'FY2026', fiscalyear_mon: 1}
    expect:
      rows:
        - {opportunity_id: 'OPP_START_1', record_type: 'ARR-MonthlyAdded', mon_year: 202506, bucket: 'New Business: ARR'}
        - {opportunity_id: 'OPP_START_1', record_type: 'ARR-Starting', mon_year: 202507, bucket: 'Starting: ARR'}

  # TEST 2
  # Validates starting exclusion:
  # opportunity ending the day before fiscal month 1 starts must not create ARR-Starting
  # but should still create ARR-MonthlyAdded in the month tied to the given start_date
  - name: int_arr_monthly_changes_does_not_create_starting_record_when_contract_ends_day_before_fiscal_month_1
    model: int_arr_monthly_changes
    given:
      - input: ref('int_arr_base')
        format: dict
        rows:
          - {ARR_Type: 'True', mon_year: 202506, mon_lastday: '2025-06-30', fiscalyear: 'FY2025', fiscalyear_mon: 12, HasParent: false, opportunity_id: 'OPP_START_NEG_1', stage_name: 'Closed Won', account_id: 'ACC_2', invoiced_date: '2025-06-15', close_date: '2025-06-10', start_date: '2025-06-15', start_date_sfdc: '2025-06-15', end_date: '2025-06-29', end_date_sfdc: '2025-06-29', arr_activation_date: '2025-06-15', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_start_date_sfdc: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_2', bucket: 'Sales : New Business : ARR', total_price: 900, parent_total_price: 0, max_parent_end_date: '1900-01-01', max_parent_end_date_sfdc: '1900-01-01'}
      - input: ref('dim_month')
        format: dict
        rows:
          - {mon_firstday: '2025-07-01', mon_lastday: '2025-07-31', mon_year: 202507, fiscalyear: 'FY2026', fiscalyear_mon: 1}
    expect:
      rows:
        - {opportunity_id: 'OPP_START_NEG_1', record_type: 'ARR-MonthlyAdded', mon_year: 202506, bucket: 'New Business: ARR'}

  # TEST 3
  # Validates monthly added new logic:
  # won invoiced opportunity with no parent must create ARR-MonthlyAdded.
  # dim_month is intentionally empty so ARR-Starting cannot be created in this test.
  - name: int_arr_monthly_changes_creates_monthly_added_for_won_invoiced_opportunity_without_parent
    model: int_arr_monthly_changes
    given:
      - input: ref('int_arr_base')
        format: dict
        rows:
          - {ARR_Type: 'True', mon_year: 202603, mon_lastday: '2026-03-31', fiscalyear: 'FY2026', fiscalyear_mon: 9, HasParent: false, opportunity_id: 'OPP_ADD_NEW_1', stage_name: 'Closed Won', account_id: 'ACC_3', invoiced_date: '2026-03-05', close_date: '2026-03-01', start_date: '2026-03-05', start_date_sfdc: '2026-03-01', end_date: '2027-03-04', end_date_sfdc: '2027-03-04', arr_activation_date: '2026-03-05', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_start_date_sfdc: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_3', bucket: 'Sales : New Business : ARR', total_price: 1200, parent_total_price: 0, max_parent_end_date: '1900-01-01', max_parent_end_date_sfdc: '1900-01-01'}
      - input: ref('dim_month')
        format: dict
        rows: []
    expect:
      rows:
        - {opportunity_id: 'OPP_ADD_NEW_1', record_type: 'ARR-MonthlyAdded', mon_year: 202603, bucket: 'New Business: ARR'}

  # TEST 4
  # Validates upsell monthly added logic:
  # won invoiced upsell must create ARR-MonthlyAdded even with parent
  - name: int_arr_monthly_changes_creates_monthly_added_for_upsell_even_with_parent
    model: int_arr_monthly_changes
    given:
      - input: ref('int_arr_base')
        format: dict
        rows:
          - {ARR_Type: 'True', mon_year: 202603, mon_lastday: '2026-03-31', fiscalyear: 'FY2026', fiscalyear_mon: 9, HasParent: true, opportunity_id: 'OPP_UPSELL_1', stage_name: 'Closed Won', account_id: 'ACC_4', invoiced_date: '2026-03-10', close_date: '2026-03-08', start_date: '2026-03-10', start_date_sfdc: '2026-03-10', end_date: '2027-03-09', end_date_sfdc: '2027-03-09', arr_activation_date: '2026-03-10', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_start_date_sfdc: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_4', bucket: 'Sales : Upsell : ARR', total_price: 300, parent_total_price: 200, max_parent_end_date: '2026-03-09', max_parent_end_date_sfdc: '2026-03-09'}
      - input: ref('dim_month')
        format: dict
        rows: []
    expect:
      rows:
        - {opportunity_id: 'OPP_UPSELL_1', record_type: 'ARR-MonthlyAdded', mon_year: 202603, bucket: 'Upsell: ARR'}

  # TEST 5
  # Validates like-new monthly added logic:
  # renewal-like record with parent and a gap greater than 1 day must create ARR-MonthlyAdded
  - name: int_arr_monthly_changes_creates_monthly_added_like_new_when_gap_after_parent_exceeds_one_day
    model: int_arr_monthly_changes
    given:
      - input: ref('int_arr_base')
        format: dict
        rows:
          - {ARR_Type: 'True', mon_year: 202603, mon_lastday: '2026-03-31', fiscalyear: 'FY2026', fiscalyear_mon: 9, HasParent: true, opportunity_id: 'OPP_LIKE_NEW_1', stage_name: 'Closed Won', account_id: 'ACC_5', invoiced_date: '2026-03-20', close_date: '2026-03-15', start_date: '2026-03-20', start_date_sfdc: '2026-03-20', end_date: '2027-03-19', end_date_sfdc: '2027-03-19', arr_activation_date: '2026-03-20', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_start_date_sfdc: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_5', bucket: 'Sales : Renewal : ARR', total_price: 1100, parent_total_price: 900, max_parent_end_date: '2026-03-10', max_parent_end_date_sfdc: '2026-03-10'}
      - input: ref('dim_month')
        format: dict
        rows: []
    expect:
      rows:
        - {opportunity_id: 'OPP_LIKE_NEW_1', record_type: 'ARR-MonthlyAdded', mon_year: 202603, bucket: 'Renewal: ARR'}

  # TEST 6
  # Validates placeholder monthly added logic:
  # placeholder record with parent and no gap must create ARR-MonthlyAdded
  - name: int_arr_monthly_changes_creates_placeholder_monthly_added_when_no_gap_after_parent
    model: int_arr_monthly_changes
    given:
      - input: ref('int_arr_base')
        format: dict
        rows:
          - {ARR_Type: 'True', mon_year: 202603, mon_lastday: '2026-03-31', fiscalyear: 'FY2026', fiscalyear_mon: 9, HasParent: true, opportunity_id: 'OPP_PLACEHOLDER_1', stage_name: 'Closed Won', account_id: 'ACC_6', invoiced_date: '2026-03-11', close_date: '2026-03-10', start_date: '2026-03-11', start_date_sfdc: '2026-03-11', end_date: '2027-03-10', end_date_sfdc: '2027-03-10', arr_activation_date: '2026-03-11', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_start_date_sfdc: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_6', bucket: 'Sales : Placeholder for Price Increase or Downsell : ARR', total_price: 150, parent_total_price: 1000, max_parent_end_date: '2026-03-10', max_parent_end_date_sfdc: '2026-03-10'}
      - input: ref('dim_month')
        format: dict
        rows: []
    expect:
      rows:
        - {opportunity_id: 'OPP_PLACEHOLDER_1', record_type: 'ARR-MonthlyAdded', mon_year: 202603, bucket: 'Placeholder for Price Increase or Downsell: ARR'}

  # TEST 7
  # Validates like-new exclusion:
  # non-placeholder parented won record with no gap must not create like-new monthly added
  - name: int_arr_monthly_changes_does_not_create_like_new_monthly_added_when_no_gap_exists
    model: int_arr_monthly_changes
    given:
      - input: ref('int_arr_base')
        format: dict
        rows:
          - {ARR_Type: 'True', mon_year: 202603, mon_lastday: '2026-03-31', fiscalyear: 'FY2026', fiscalyear_mon: 9, HasParent: true, opportunity_id: 'OPP_NOGAP_NO_LIKENEW_1', stage_name: 'Closed Won', account_id: 'ACC_7', invoiced_date: '2026-03-11', close_date: '2026-03-10', start_date: '2026-03-11', start_date_sfdc: '2026-03-11', end_date: '2027-03-10', end_date_sfdc: '2027-03-10', arr_activation_date: '2026-03-11', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_start_date_sfdc: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_7', bucket: 'Sales : Renewal : ARR', total_price: 800, parent_total_price: 700, max_parent_end_date: '2026-03-10', max_parent_end_date_sfdc: '2026-03-10'}
      - input: ref('dim_month')
        format: dict
        rows: []
    expect:
