  # TEST 12
  # Validates monthly-added expiration creation when renewal is not ready.
  # Each ARR type should create:
  #   1) ARR-MonthlyAdded in its given month
  #   2) ARR-MonthlyReduced expiration in the month after end_date
  - name: int_arr_monthly_changes_creates_expiration_for_monthly_added_when_renewal_is_not_ready
    model: int_arr_monthly_changes
    given:
      - input: ref('int_arr_base')
        format: dict
