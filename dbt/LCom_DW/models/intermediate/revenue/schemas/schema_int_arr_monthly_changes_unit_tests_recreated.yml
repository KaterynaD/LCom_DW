      - input: ref('dim_month')
        format: dict
        rows: []
    expect:
      rows: []

  # TEST 9
  # Validates cancellation reduced logic:
  # closed lost renewal with no gap must create ARR-MonthlyReduced cancellation row
  - name: int_arr_monthly_changes_creates_cancellation_reduced_record_for_closed_lost_renewal_with_no_gap
