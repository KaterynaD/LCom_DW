  # TEST 10
  # Validates cancellation exclusion:
  # closed lost cancellation candidate with a gap must not create cancellation row
  - name: int_arr_monthly_changes_does_not_create_cancellation_reduced_record_when_gap_exists
    model: int_arr_monthly_changes
    given:
      - input: ref('int_arr_base')
        format: dict
        rows:
          - {ARR_Type: 'True', mon_year: 202603, mon_lastday: '2026-03-31', fiscalyear: 'FY2026', fiscalyear_mon: 9, HasParent: true, opportunity_id: 'OPP_CANCEL_NEG_1', stage_name: 'Closed Lost', account_id: 'ACC_10', invoiced_date: '1900-01-01', close_date: '2026-03-15', start_date: '2026-03-15', start_date_sfdc: '2026-03-15', end_date: '2027-03-14', end_date_sfdc: '2027-03-14', arr_activation_date: '2026-03-15', renewal_opportunity_id: 'Unknown', renewal_stage_name: 'Unknown', renewal_invoiced_date: '1900-01-01', renewal_close_date: '1900-01-01', renewal_start_date: '1900-01-01', renewal_start_date_sfdc: '1900-01-01', renewal_end_date: '1900-01-01', sfdc_product_id: 'PROD_10', bucket: 'Sales : Cancellation : ARR', total_price: -400, parent_total_price: -400, max_parent_end_date: '2026-03-10', max_parent_end_date_sfdc: '2026-03-10'}
      - input: ref('dim_month')
        format: dict
        rows:
          - {mon_firstday: '2026-03-01', mon_lastday: '2026-03-31', mon_year: 202603, fiscalyear: 'FY2026', fiscalyear_mon: 9}
          - {mon_firstday: '2026-04-01', mon_lastday: '2026-04-30', mon_year: 202604, fiscalyear: 'FY2026', fiscalyear_mon: 10}
    expect:
      rows: []
      
