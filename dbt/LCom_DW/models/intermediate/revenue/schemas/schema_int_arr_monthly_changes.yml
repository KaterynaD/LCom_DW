version: 2

models:
  - name: int_arr_monthly_changes
    description: >-
      Intermediate model for monthly ARR changes for all ARR logica.
      Produces monthly ARR starting, monthly additions, and reductions at the grain of
      ARR type, month, opportunity, product, and sfdc bucket, stitching together parent and renewals opportunities.
      (It's possible to have duplicates accross Starting and Expired bucket because it's the same for New, Upsell or Renewal sfdc bucket.)

    config:
      contract:
        enforced: true
      tags:
        - intermediate
        - revenue
        - arr


    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ARR_Type
            - record_type
            - mon_year
            - opportunity_id
            - sfdc_product_id
            - bucket
            - bucket_sfdc

    columns:

      - name: ARR_Type
        description: Type of ARR (True, Preliminary, Backdated) determined by opportunity lifecycle timing logic.
        data_type: varchar(20)
        constraints:
          - type: not_null

      - name: record_type
        description: >-
          ARR monthly movement type generated by this model, such as ARR-Starting,
          ARR-MonthlyAdded, or ARR-MonthlyReduced.
        data_type: varchar(20)
        constraints:
          - type: not_null

      - name: mon_year
        description: Calendar month in YYYYMM-style integer for the ARR movement month.
        data_type: integer
        constraints:
          - type: not_null

      - name: mon_lastday
        description: Last day of the month corresponding to mon_year.
        data_type: date
        constraints:
          - type: not_null

      - name: fiscalyear
        description: Fiscal year for the ARR movement month in a form yyyy_start/yyyy_end.
        data_type: varchar(20)
        constraints:
          - type: not_null

      - name: fiscalyear_mon
        description: Fiscal month number within the fiscal year for the ARR movement month.
        data_type: integer
        constraints:
          - type: not_null

      - name: hasparent
        description: True when the opportunity has at least one prior parent opportunity in its renewal chain.
        data_type: boolean
        constraints:
          - type: not_null

      - name: opportunity_id
        description: "{{ doc('column_opportunity_id') }}"
        data_type: varchar(300)
        constraints:
          - type: not_null

      - name: stage_name
        description: "{{ doc('column_stage_name') }}"
        data_type: varchar(780)
        constraints:
          - type: not_null

      - name: account_id
        description: "{{ doc('column_account_id') }}"
        data_type: varchar(300)
        constraints:
          - type: not_null

      - name: invoiced_date
        description: "{{ doc('column_invoiced_date') }}"
        data_type: date
        constraints:
          - type: not_null

      - name: close_date
        description: "{{ doc('column_close_date') }}"
        data_type: date
        constraints:
          - type: not_null

      - name: start_date
        description: >-
          It derives from int_arr_base start_date except ARR-MonthlyReduced rows produced by expiration logic where
          it is overwritten with the original opportunity end_date plus 1 day, because the reduction starts when the prior ARR term ends.          

        data_type: date
        constraints:
          - type: not_null

      - name: start_date_sfdc
        description: >-
          Original Salesforce opportunity start date before ARR extension logic.
        data_type: date
        constraints:
          - type: not_null

      - name: end_date
        description: >-
          It derives from int_arr_base end_date except ARR-MonthlyReduced rows produced by expiration logic where
          - it becomes 3000-01-01 when there is a gap of more than one day between the current opportunity 
          end_date and its renewal_start date, or when the renewal is not yet ready;
          - it becomes one day before renewal_invoiced_date for qualifying won renewals;
          - it becomes one day before renewal_close_date for Closed Lost renewals.

        data_type: date
        constraints:
          - type: not_null

      - name: end_date_sfdc
        description: >-
          Original Salesforce opportunity end date before ARR extension logic.
        data_type: date
        constraints:
          - type: not_null

      - name: arr_activation_date
        description: >-
          ARR activation date is applicable only for Backdated ARR in most cases and for Expiration date for all ARR types.
          • ARR-Starting: invoiced_date  
          • ARR-MonthlyAdded & Cancellations: derives from arr_activation_date in int_arr_base
          • ARR-MonthlyReduced (Expirations): original opportunity end_date plus 1 day (reduction activates when the prior ARR term expires.)
          
          Default, 1900-01-01 in allother ARR types

        data_type: date
        constraints:
          - type: not_null

      - name: arr_deactivation_date
        description: >-
          ARR deactivation date is applicable only for Backdated ARR.
          • 3000-01-01 = open-ended (remains active) everywhere except when ARR-MonthlyReduced by expiration logic  
          • ARR-MonthlyReduced (Expirations): 3000-01-01 if there is a gap before renewal; otherwise one day before renewal invoiced_date for Closed Won / Upsell, or one day before renewal_close_date for Closed Lost.

          Default, 3000-01-01 in allother ARR types
        data_type: date
        constraints:
          - type: not_null

      - name: renewal_opportunity_id
        description: "{{ doc('column_renewal_opportunity_id') }}"
        data_type: varchar(300)
        constraints:
          - type: not_null

      - name: renewal_stage_name
        description: Stage name of the linked renewal opportunity.
        data_type: varchar(780)
        constraints:
          - type: not_null

      - name: renewal_invoiced_date
        description: Invoiced date of the linked renewal opportunity.
        data_type: date
        constraints:
          - type: not_null

      - name: renewal_close_date
        description: Close date of the linked renewal opportunity.
        data_type: date
        constraints:
          - type: not_null

      - name: renewal_start_date
        description: >-
          It derives from int_arr_base renewal_start_date.

          In this model, renewal_start_date is carried forward unchanged, but is used to drive logic: 
          it is compared to max_parent_end_date to detect gaps vs. continuous renewals, 
          and to end_date to determine whether expirations remain open or stop at renewal.

        data_type: date
        constraints:
          - type: not_null

      - name: renewal_start_date_sfdc
        description: >-
          Original Salesforce start date of the linked renewal opportunity before preliminary ARR
          timing adjustments.
        data_type: date
        constraints:
          - type: not_null

      - name: renewal_end_date
        description: Effective or inherited end date of the linked renewal opportunity.
        data_type: date
        constraints:
          - type: not_null

      - name: sfdc_product_id
        description: "{{ doc('column_sfdc_product_id') }}"
        data_type: varchar(300)
        constraints:
          - type: not_null

      - name: bucket
        description: >-
          Normalized ARR movement bucket with the 'Sales : ' prefix removed and delimiters standardized.
          Examples include Starting: ARR, New Business: ARR, Placeholder for Price Increase or Downsell: ARR,
          Expired: ARR, or Cancellation: Biz Dev.
        data_type: varchar(100)
        constraints:
          - type: not_null

      - name: bucket_sfdc
        description: Original upstream bucket value before bucket normalization.
        data_type: varchar(100)
        constraints:
          - type: not_null

      - name: total_price
        description: ARR amount for the current opportunity contribution for this monthly movement row.
        data_type: numeric(38,10)
        constraints:
          - type: not_null

      - name: parent_total_price
        description: ARR amount from the parent opportunity context for this monthly movement row.
        data_type: numeric(38,10)
        constraints:
          - type: not_null

      - name: max_parent_end_date
        description: >-
          It derives from int_arr_bas max_parent_end_date.

          In this model, max_parent_end_date is carried forward unchanged, but is used to drive logic: 
          - it is compared to start_date to determine whether there is more than a one-day gap between parent ARR
          ending and renewal ARR beginning, which drives whether a row is treated as ARR-MonthlyAdded like new ARR
          or as placeholder price increase/downsell logic; 
          - it is also used in the cancellation logic to determine whether a Closed Lost renewal should be treated
          as a cancellation event rather than only an expiration.

        data_type: date
        constraints:
          - type: not_null

      - name: max_parent_end_date_sfdc
        description: Original latest parent opportunity end date before preliminary extension logic was applied.
        data_type: date
        constraints:
          - type: not_null
      - name: loaddate
        data_type: timestamp
        description: "{{ doc('column_loaddate') }}"
        constraints:
          - type: not_null
		            