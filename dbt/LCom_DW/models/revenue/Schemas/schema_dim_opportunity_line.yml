version: 2
models:
- name: dim_opportunity_line
  description: Salesforce opportunity line-level product and pricing information.
    Bridge dimensin between Fact_Opportunity and DIM_SFDC_Product
  config:
    contract:
      enforced: true
    tags:
    - dim
    - revenue
  columns:
  - name: opportunity_line_id
    data_type: VARCHAR(300)
    description: Primary Key of DIM_OPPORTUNITY_LINE. Opportunity Line Item ID
    constraints:
    - type: not_null
    - type: primary_key
      warn_unenforced: false
    data_tests:
    - unique
  - name: sfdc_product_id
    data_type: VARCHAR(300)
    description: "{{ doc('column_sfdc_product_id') }}"
    constraints:
    - type: not_null
    data_tests:
    - relationships:
        to: ref('dim_sfdc_product')
        field: sfdc_product_id
  - name: opportunity_id
    data_type: VARCHAR(300)
    description: "{{ doc('column_opportunity_id') }}"
    constraints:
    - type: not_null
    data_tests:
    - dbt_utils.relationships_where:
        to: ref('fact_opportunity')
        field: opportunity_id
        from_condition: opportunity_id != '{{ var("default_ID") }}'
  - name: start_date
    data_type: DATE
    description: "{{ doc('column_start_date') }}"
    constraints:
    - type: not_null
  - name: end_date
    data_type: DATE
    description: "{{ doc('column_end_date') }}"
    constraints:
    - type: not_null
  - name: subscription_term
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_opportunity_line_subscription_term') }}"
    constraints:
    - type: not_null
  - name: quantity
    data_type: INTEGER
    description: "{{ doc('column_quantity') }}"
    constraints:
    - type: not_null
  - name: total_price
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_total_price') }}"
    constraints:
    - type: not_null
  - name: unit_price
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_unit_price') }}"
    constraints:
    - type: not_null
  - name: weighted_total_price
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_weighted_total_price') }}"
    constraints:
    - type: not_null
  - name: combine_new_biz_arr
    data_type: NUMERIC(36,17)
    description: "{{ doc('column_combine_new_biz_arr') }}"
    constraints:
    - type: not_null
  - name: combine_renewal_arrs
    data_type: NUMERIC(37,17)
    description: "{{ doc('column_combine_renewal_arrs') }}"
    constraints:
    - type: not_null
  - name: combine_upsell_arrs
    data_type: NUMERIC(37,17)
    description: "{{ doc('column_combine_upsell_arrs') }}"
    constraints:
    - type: not_null
  - name: name
    data_type: VARCHAR(1200)
    description: "{{ doc('column_opportunity_line_name') }}"
    constraints:
    - type: not_null
  - name: description
    data_type: VARCHAR(1200)
    description: "{{ doc('column_description') }}"
    constraints:
    - type: not_null
  - name: netsuite_id
    data_type: VARCHAR(50)
    description: "{{ doc('column_netsuite_id') }}"
    constraints:
    - type: not_null
  - name: netsuite_sku
    data_type: VARCHAR(90)
    description: "{{ doc('column_netsuite_sku') }}"
    constraints:
    - type: not_null
  - name: no_of_buildings
    data_type: INTEGER
    description: "{{ doc('column_no_of_buildings') }}"
    constraints:
    - type: not_null
  - name: no_of_licenses
    data_type: INTEGER
    description: "{{ doc('column_no_of_licenses') }}"
    constraints:
    - type: not_null
  - name: discount
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_discount') }}"
    constraints:
    - type: not_null
  - name: discount_applied
    data_type: VARCHAR(25)
    description: "{{ doc('column_discount_applied') }}"
    constraints:
    - type: not_null
  - name: easy_tech_arr
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_easy_tech_arr') }}"
    constraints:
    - type: not_null
  - name: gold_service_on_quote
    data_type: INTEGER
    description: "{{ doc('column_gold_service_on_quote') }}"
    constraints:
    - type: not_null
  - name: is_active_opp_product
    data_type: BOOLEAN
    description: "{{ doc('column_is_active_opp_product') }}"
    constraints:
    - type: not_null
  - name: learning_sbxid
    data_type: VARCHAR(55)
    description: "{{ doc('column_learning_sbxid') }}"
    constraints:
    - type: not_null
  - name: list_price
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_list_price') }}"
    constraints:
    - type: not_null
  - name: net_price_display
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_net_price_display') }}"
    constraints:
    - type: not_null
  - name: net_unit_price
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_net_unit_price') }}"
    constraints:
    - type: not_null
  - name: opp_probability
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_opp_probability') }}"
    constraints:
    - type: not_null
  - name: opportunity_product_arr
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_opportunity_product_arr') }}"
    constraints:
    - type: not_null
  - name: pricebook_entry_id
    data_type: VARCHAR(18)
    description: "{{ doc('column_pricebook_entry_id') }}"
    constraints:
    - type: not_null
  - name: pricebook_id
    data_type: VARCHAR(18)
    description: "{{ doc('column_pricebook_id') }}"
    constraints:
    - type: not_null
  - name: pro_rate_adj_term
    data_type: NUMERIC(35,17)
    description: "{{ doc('column_pro_rate_adj_term') }}"
    constraints:
    - type: not_null
  - name: record_type
    data_type: VARCHAR(765)
    description: "{{ doc('column_record_type') }}"
    constraints:
    - type: not_null
  - name: sfdc_product_code
    data_type: VARCHAR(765)
    description: "{{ doc('column_sfdc_product_code') }}"
    constraints:
    - type: not_null
  - name: sfdc_product_description
    data_type: VARCHAR(4000)
    description: "{{ doc('column_sfdc_product_description') }}"
    constraints:
    - type: not_null
  - name: sbqq_quote_line
    data_type: VARCHAR(50)
    description: "{{ doc('column_sbqq_quote_line') }}"
    constraints:
    - type: not_null
  - name: business_type_opty_product
    data_type: VARCHAR(765)
    description: "{{ doc('column_business_type_opty_product') }}"
    constraints:
    - type: not_null
  - name: class
    data_type: VARCHAR(765)
    description: "{{ doc('column_class') }} or if class is empty, then business_type_opty_product - {{ doc('column_business_type_opty_product') }}"
    constraints:
    - type: not_null
  - name: created_date
    data_type: TIMESTAMP WITHOUT TIME ZONE
    description: "{{ doc('column_created_date') }}"
    constraints:
    - type: not_null
  - name: last_modified_date
    data_type: TIMESTAMP WITHOUT TIME ZONE
    description: "{{ doc('column_last_modified_date') }}"
    constraints:
    - type: not_null
  - name: loaddate
    data_type: timestamp
    description: "{{ doc('column_loaddate') }}"
    constraints:
    - type: not_null
