  - name: stakeholders_confirmed
    data_type: boolean
    description: Stakeholders Confirmed (Have you confirmed Interest of all stakeholders?)
    constraints:
    - type: not_null
  - name: start_date
    data_type: date
    description: Start Date (This is the date that licenses should start.)
    constraints:
    - type: not_null
  - name: subscription_end_date
    data_type: date
    description: Subscription End Date (Subscription End Date)
    constraints:
    - type: not_null
  - name: subscription_start_date
    data_type: date
    description: Subscription Start Date (Subscription Start Date)
    constraints:
    - type: not_null
  - name: subscription_term
    data_type: double precision
    description: Subscription Term
    constraints:
    - type: not_null
  - name: success_plan_agreed_upon
    data_type: boolean
    description: Success Plan Agreed Upon?
    constraints:
    - type: not_null
  - name: success_plan_shared
    data_type: boolean
    description: Success Plan Shared
    constraints:
    - type: not_null
  - name: total_arr_bookings
    data_type: numeric(38,10)
    description: Total ARR Bookings (Captures renewal ARR + Upsell ARR)
    constraints:
    - type: not_null
  - name: total_credit_from_opp_product
    data_type: double precision
    description: Total credit from opp Product (Total Credit from opp Product)
    constraints:
    - type: not_null
  - name: total_opportunity_quantity
    data_type: double precision
    description: Quantity
    constraints:
    - type: not_null
  - name: training_session_created
    data_type: boolean
    description: Training Session created (Training Session created)
    constraints:
    - type: not_null


  - name: transacted_opp_id
    data_type: varchar(300)
    description: Transacted Opportunity (for combine_upsell_arrs)
    constraints:
    - type: not_null


  - name: true_arr
    data_type: numeric(35,10)
    description: True ARR (Denotes the true ARR value of an opportunity.  Populated
      by a scheduled flow to allow for roll-up summary to be used on the account object
      to report on true ARR)
    constraints:
    - type: not_null
  - name: true_arr_formula
    data_type: double precision
    description: True ARR (Formula) (Looks at Override ARR and if that field is greater
      than zero, returns Override, else returns Source Opp ARR from previous contract)
    constraints:
    - type: not_null
  - name: true_renewal_arr
    data_type: double precision
    description: True Renewal ARR
    constraints:
    - type: not_null
  - name: update_close_date
    data_type: boolean
    description: Update Close Date
    constraints:
    - type: not_null
  - name: validation_bypass_date_time
    data_type: timestamp
    description: ValidationBypassDateTime (Adding delay to avoid flows and validation
      rules running at the same time and erroring out https://admin.salesforce.com/blog/2022/how-i-solved-it-bypass-validation-rules-in-flows)
    constraints:
    - type: not_null
  - name: variance
    data_type: numeric(36,10)
    description: Variance (Variance of Opp amount and PO amount)
    constraints:
    - type: not_null
  - name: vendor_of_choice
    data_type: boolean
    description: Vendor of Choice
    constraints:
    - type: not_null
  - name: verbal_commitment
    data_type: boolean
    description: Verbal Commitment
    constraints:
    - type: not_null
  - name: x_1_st_contact
    data_type: varchar(30)
    description: 1st Contact
    constraints:
    - type: not_null
  - name: x_1_st_contact_email
    data_type: varchar(250)
    description: 1st Contact Email
    constraints:
    - type: not_null
  - name: x_1_st_contact_name
    data_type: varchar(780)
    description: 1st Contact Name
    constraints:
    - type: not_null
  - name: x_1_st_contact_role
    data_type: varchar(780)
    description: 1st Contact Role
    constraints:
    - type: not_null
  - name: x_18_for_12
    data_type: boolean
    description: 18 for 12
    constraints:
    - type: not_null


  - name: x_2_nd_contact_email
    data_type: varchar(250)
    description: 2nd Contact Email
