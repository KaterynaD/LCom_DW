version: 2
models:
- name: fact_opportunity
  description: Fact Opportunity (Salesforce Opportunity table)
  config:
    contract:
      enforced: true
    tags:
    - fact
    - revenue
  columns:
  - name: opportunity_id
    data_type: varchar(300)
    description: Primary Key of FACT_OPPORTUNITY. It`s Salesforce Opportunity ID column
    constraints:
    - type: not_null
    - type: primary_key
      warn_unenforced: false
    data_tests:
    - unique
  - name: name
    data_type: varchar(300)
    description: Opportunity Name
    constraints:
    - type: not_null
  - name: account_id
    data_type: varchar(300)
    description: DIM_ACCOUNT FK 
    constraints:
    - type: not_null
    data_tests:
    - relationships:
        to: ref('dim_account')
        field: account_id
        
  - name: sfdc_account_id
    data_type: varchar(300)
    description: Salesforce Account ID
    constraints:
    - type: not_null
  - name: account_manager
    data_type: varchar(30)
    description: Renewal Owner
    constraints:
    - type: not_null
  - name: account_name_email
    data_type: varchar(780)
    description: Account Name (Email)
    constraints:
    - type: not_null
  - name: activity_metric_id
    data_type: varchar(30)
    description: Activity Metric
    constraints:
    - type: not_null
  - name: already_booked
    data_type: boolean
    description: Already Booked
    constraints:
    - type: not_null
  - name: amount
    data_type: numeric(35,10)
    description: Amount
    constraints:
    - type: not_null
  - name: amount_won
    data_type: numeric(35,10)
    description: Amount Won
    constraints:
    - type: not_null
  - name: arr_bands
    data_type: varchar(30)
    description: ARR Bands
    constraints:
    - type: not_null
  - name: arr
    data_type: double precision
    description: ARR (implemented to capture ARR value of opportunity)
    constraints:
    - type: not_null
  - name: arr_new_business
    data_type: numeric(38,10)
    description: ARR New Business (ARR New Business)
    constraints:
    - type: not_null
  - name: arr_renewal
    data_type: numeric(38,10)
    description: ARR Renewal (ARR renewal)
    constraints:
    - type: not_null
  - name: arr_upsell
    data_type: numeric(38,10)
    description: ARR Upsell (ARR Upsell)
    constraints:
    - type: not_null
  - name: arr_won
    data_type: numeric(38,10)
    description: ARR Won
    constraints:
    - type: not_null
  - name: billing_addressee
    data_type: varchar(160)
    description: Billing Addressee (Billing Addressee)
    constraints:
    - type: not_null
  - name: billing_city
    data_type: varchar(120)
    description: Billing City (Billing City)
    constraints:
    - type: not_null
  - name: billing_state
    data_type: varchar(780)
    description: Billing State (Billing State)
    constraints:
    - type: not_null
  - name: billing_street
    data_type: varchar(780)
    description: Billing Street (Billing Street)
    constraints:
    - type: not_null
  - name: billing_zipcode
    data_type: varchar(120)
    description: Billing Zipcode (Billing Zipcode)
    constraints:
    - type: not_null
  - name: churn_date
    data_type: date
    description: Churn Date
    constraints:
    - type: not_null    
  - name: churn_formula
    data_type: double precision
    description: Churn (Formula) (If the opportunity is lost will calculate a negative
      value for churn)
    constraints:
    - type: not_null
  - name: close_date
    data_type: date
    description: Close Date
    constraints:
    - type: not_null
  - name: closed_won_date_time
    data_type: timestamp
    description: Closed Won Date/Time (Used to Capture Closed Won Date and Time)
    constraints:
    - type: not_null
  - name: codesters_has_licenses_synced
    data_type: boolean
    description: Has Licenses Synced
    constraints:
    - type: not_null
  - name: codesters_number_of_licenses
    data_type: bigint
    description: Number of Licenses
    constraints:
    - type: not_null
  - name: codesters_number_of_synced_licenses
    data_type: bigint
    description: Number of Synced Licenses
    constraints:
    - type: not_null
  - name: codesters_order_to_be_extended
    data_type: boolean
    description: Codesters Order to be Extended (Used as part of the Jun-23 order
      unenforcement process. Denotes that an opp is an exception to the standard unenforcement
      process (new licenses created to run 7/1 - 10/31) and instead has had their
      existing licenses extended.)
    constraints:
    - type: not_null
  - name: codesters_order_to_be_unenforced
    data_type: boolean
    description: Codesters Order to be Unenforced (Used as part of the Jun-23 order
      unenforcement process. Denotes that an opp should be unenforced according to
      standard process (new licenses created to run 7/1 - 10/31).)
    constraints:
    - type: not_null
  - name: codesters_renewal
    data_type: boolean
    description: Codesters Renewal (Used for breaking out Codesters renewal opps for
      CSM comp plans)
    constraints:
    - type: not_null
  - name: combined_arr
    data_type: numeric(38,10)
    description: Combined ARR
    constraints:
    - type: not_null
  - name: contract_id
    data_type: varchar(30)
    description: Contract
    constraints:
    - type: not_null
  - name: created_by_id
    data_type: varchar(30)
    description: Created By
    constraints:
    - type: not_null
  - name: created_date
    data_type: timestamp
    description: Created Date in PST
    constraints:
    - type: not_null
  - name: csm_email
    data_type: varchar(400)
    description: CSM Email
    constraints:
    - type: not_null
  - name: csm_introduced
    data_type: boolean
    description: CSM Introduced
    constraints:
    - type: not_null
  - name: csm_name
    data_type: varchar(380)
    description: CSM Name
    constraints:
    - type: not_null
  - name: data_quality_description
    data_type: varchar(70)
    description: Data Quality Description
    constraints:
    - type: not_null
  - name: data_quality_score
    data_type: integer
    description: Data Quality Score
    constraints:
    - type: not_null
  - name: deal_docs_completed
    data_type: boolean
    description: Deal Docs Completed?
    constraints:
    - type: not_null
  - name: description
    data_type: varchar(max)
    description: Description
    constraints:
    - type: not_null
  - name: disable_auto_renewal_opp
    data_type: boolean
    description: Disable Auto Renewal
    constraints:
    - type: not_null
  - name: disable_odc
    data_type: boolean
