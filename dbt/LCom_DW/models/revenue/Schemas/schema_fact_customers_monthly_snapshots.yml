version: 2

models:
  - name: fact_customers_monthly_snapshots          
    description: >
      Monthly fact table that consolidates customer-lifecycle snapshots from:
        • stg_customers_contract_monthly_snapshots   (record_type = Starting)
        • stg_customers_new_monthly_snapshots        (New, Returning)
        • stg_customers_churn_monthly_snapshots      (Churn)
        • stg_customers_nonrenewal_monthly_snapshots (NonRenewal, Ghost)

      Each row represents a single Salesforce opportunity for an Ultimate
      Parent Account in a specific month, classified by its lifecycle state.
      The table is the canonical source for Contract Active, Net Active, Total Active, New, Returning, Churn,
      NonRenewal, and Ghost customer counts.

      There is also additional filter of records to include Churn records only once per Fiscal Year if there are no "Returning" opportunities in between.

      The table is refreshed completly in each run due to complexity of the calculations, so it is not a real snapshot table. The data are freeze in the underlying staging tables.

    config:
      contract:
        enforced: true      
      tags:
        - fact
        - customers
        - revenue        

    columns:

      - name: mon_year
        data_type: integer
        description: Year-month of the snapshot in `YYYYMM` format. The base date depends on customer-lifecycle snapshots
        constraints:
         - type: not_null  

      - name: mon_lastday
        data_type: date
        description: Last calendar day of the snapshot month.
        constraints:
         - type: not_null          

      - name: opportunity_id
        data_type: varchar(300)
        description: Salesforce Opportunity ID represented in the snapshot.
        constraints:
         - type: not_null          

      - name: sfdc_account_id
        data_type: varchar(300)
        description: Salesforce Account ID for the opportunity.
        constraints:
         - type: not_null          

      - name: sfdc_ultimate_parent_id
        data_type: varchar(300)
        description: Salesforce Ultimate Parent Account ID.
        constraints:
         - type: not_null  

      - name: record_type
        data_type: varchar(20)
        description: >
          Customer-lifecycle classification for the month.
          Possible values:  
            • **Starting** – contract carried into the period  
            • **New** – first contract ever for the parent account  
            • **Returning** – contract resumes after ≥ 1-month gap  
            • **Churn** – all contracts ended; no active renewals  
            • **NonRenewal** – contract expired <= 6 months ago, auto-renew disabled  
            • **Ghost** – same as NonRenewal but auto-renew flag is false
        constraints:
         - type: not_null              
        tests:        
          - accepted_values:
              values: ['Starting', 'New', 'Returning', 'ReturningFY', 'Churn', 'NonRenewal', 'Ghost']

      - name: include_flg
        data_type: boolean
        description: >
          True if the record should be counted in Net Active customer metrics
          for the snapshot month; false when the row is needed only for churn/
          non-renewal reporting.
        constraints:
         - type: not_null  

      - name: comments
        data_type: varchar(max)
        description: Free-form comments or debugging notes.

      - name: loaddate
        data_type: timestamp
        description: The datetime the record was loaded in PST
        constraints:
         - type: not_null         
