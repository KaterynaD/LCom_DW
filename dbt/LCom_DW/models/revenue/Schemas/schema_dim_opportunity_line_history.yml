    constraints:
    - type: not_null
    data_tests:
    - not_null
    
  - name: loaddate
    data_type: TIMESTAMP WITHOUT TIME ZONE
    description: "{{ doc('column_loaddate') }}"
    constraints:
    - type: not_null
    data_tests:
    - not_null

  - name: updatedate
    data_type: TIMESTAMP WITHOUT TIME ZONE
    description: "{{ doc('column_updatedate') }}"
    constraints:
    - type: not_null
    data_tests:
    - not_null

  - name: scd_hash
