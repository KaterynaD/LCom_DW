    description: "{{ doc('column_po_amount') }}"
    constraints:
    - type: not_null

  - name: price_increase_arr
    data_type: numeric(16,2)
    description: "{{ doc('column_price_increase_arr') }}"
    constraints:
    - type: not_null

  - name: probability
    data_type: numeric(16,2)
    description: "{{ doc('column_probability') }}"
    constraints:
    - type: not_null

  - name: quote_list_amount
    data_type: numeric(16,2)
    description: "{{ doc('column_quote_list_amount') }}"
    constraints:
    - type: not_null

  - name: renewable_revenue
    data_type: numeric(16,2)
    description: "{{ doc('column_renewable_revenue') }}"
    constraints:
    - type: not_null

  
  - name: total_arr_bookings
    data_type: numeric(16,2)
    description: "{{ doc('column_total_arr_bookings') }}"
    constraints:
    - type: not_null

  
  - name: true_arr
    data_type: numeric(16,2)
    description: "{{ doc('column_true_arr') }}"
    constraints:
    - type: not_null

  - name: true_arr_formula
    data_type: numeric(16,2)
    description: "{{ doc('column_true_arr_formula') }}"
    constraints:
    - type: not_null

  - name: true_renewal_arr
    data_type: numeric(16,2)
    description: "{{ doc('column_true_renewal_arr') }}"
    constraints:
    - type: not_null
   
  - name: loaddate
    data_type: timestamp
