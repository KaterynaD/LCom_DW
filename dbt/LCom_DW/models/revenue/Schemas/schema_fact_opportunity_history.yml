version: 2
models:
- name: int_opportunity_history
  description: An ephemeral, intermediate model to be used in the Fact Opportunity history table (Slowly Changing Dimension Type 2) model and scd2_current_matches_source test.

- name: fact_opportunity_history
  description: Fact Opportunity (Salesforce Opportunity table) metrics snapshots table
    when the stage changes. It`s a fact table, but history is tracked as SCD2 (fromdate
    - todate)
  data_tests:
  - scd2_plus_validation:
      unique_key: opportunity_id
      scd_valid_from_col_name: fromdate
      scd_valid_to_col_name: todate
  - no_consecutive_duplicate_scd_hash:
      unique_key: opportunity_id  
  - scd2_current_matches_source:
      source_model: int_opportunity_history
      unique_key: opportunity_id   
      scd_valid_to_col_name: todate
      scd_valid_to_max_date: '3000-12-31'
      check_cols:
        - stage_name
        - name
        - amount
        - amount_won
        - arr
        - arr_new_business
        - arr_renewal
        - arr_upsell
        - arr_won
        - combined_arr
        - downsell
        - multi_year_arr
        - new_biz_arr_trigger
        - nnarr
        - nrr_renewal
        - po_amount
        - price_increase_arr
        - probability
        - quote_list_amount
        - renewable_revenue
        - total_arr_bookings
        - true_arr
        - true_arr_formula
        - true_renewal_arr
        - invoiced_date
        - close_date
        - start_date
        - end_date
        - opp_record_type
        - license_unenforced
        - disable_auto_renewal_opp
        - number_of_schools
        - number_of_students
        - multi_year_discount_rate
        - owner_id
  config:
    contract:
      enforced: false
    tags:
    - fact
    - revenue
  columns:
  - name: opportunity_hist_id
    data_type: varchar(300)
    description: Primary Key of FACT_OPPORTUNITY_HISTORY.
    constraints:
    - type: not_null
    - type: primary_key
      warn_unenforced: false
    data_tests:
    - unique
  - name: fromdate
    data_type: timestamp
    description: "{{ doc('column_fromdate') }}"
    constraints:
    - type: not_null

  - name: todate
    data_type: timestamp
    description: "{{ doc('column_todate') }}"
    constraints:
    - type: not_null

  - name: record_version
    data_type: integer
    description: "{{ doc('column_record_version') }}"
    constraints:
    - type: not_null

  - name: opportunity_id
    data_type: varchar(300)
    description: "{{ doc('column_opportunity_id') }}"
    constraints:
    - type: not_null

  - name: stage_name
    data_type: varchar(780)
    description: "{{ doc('column_stage_name') }}"
    constraints:
    - type: not_null

  - name: account_id
    data_type: varchar(300)
    description: "{{ doc('column_account_id') }}"
    constraints:
    - type: not_null

  - name: name
    data_type: varchar(300)
    description: "{{ doc('column_opportnity_name') }}"
    constraints:
    - type: not_null

  - name: amount
    data_type: numeric(16,2)
    description: "{{ doc('column_amount') }}"
    constraints:
    - type: not_null

  - name: amount_won
    data_type: numeric(16,2)
    description: "{{ doc('column_amount_won') }}"
    constraints:
    - type: not_null

  - name: arr
    data_type: numeric(16,2)
    description: "{{ doc('column_arr') }}"
    constraints:
    - type: not_null

  - name: arr_new_business
    data_type: numeric(16,2)
    description: "{{ doc('column_arr_new_business') }}"
    constraints:
    - type: not_null

  - name: arr_renewal
    data_type: numeric(16,2)
    description: "{{ doc('column_arr_renewal') }}"
    constraints:
    - type: not_null

  - name: arr_upsell
    data_type: numeric(16,2)
    description: "{{ doc('column_arr_upsell') }}"
    constraints:
    - type: not_null

  - name: arr_won
    data_type: numeric(16,2)
    description: "{{ doc('column_arr_won') }}"
    constraints:
    - type: not_null

  - name: combined_arr
    data_type: numeric(16,2)
    description: "{{ doc('column_combined_arr') }}"
    constraints:
    - type: not_null

  - name: downsell
    data_type: numeric(16,2)
    description: "{{ doc('column_downsell') }}"
    constraints:
    - type: not_null

  
  - name: multi_year_arr
    data_type: numeric(16,2)
    description: "{{ doc('column_multi_year_arr') }}"
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: new_biz_arr_trigger
    data_type: numeric(16,2)
    description: "{{ doc('column_new_biz_arr_trigger') }}"
    constraints:
    - type: not_null

  - name: nnarr
    data_type: numeric(16,2)
    description: "{{ doc('column_nnarr') }}"
    constraints:
    - type: not_null

  - name: nrr_renewal
    data_type: numeric(16,2)
    description: "{{ doc('column_nrr_renewal') }}"
    constraints:
    - type: not_null

  
  - name: po_amount
