version: 2

models:
  - name: sfdc_profiles
    data_tests:
      - comparing_profiles_test:
          profile_name_base: 'full_profile'
          profile_name_compared: 'current_FY_profile'
          metrics:
            - name: pct_nulls
              threshold: 10
            - name: pct_uniqs
              threshold: 10
            - name: vc_normalized_shannon_entropy
              threshold: 10              
            - name: num_mean
              threshold: 10
          config:
            severity: warn
            store_failures: true
            database: rawdata
            schema: profiles
            alias: full_to_current_FY_comparing

      - comparing_profiles_test:
          profile_name_base: 'prev_FY_profile'
          profile_name_compared: 'current_FY_profile'
          metrics:
            - name: pct_nulls
              threshold: 10
            - name: pct_uniqs
              threshold: 10
            - name: vc_normalized_shannon_entropy
              threshold: 10              
            - name: num_mean
              threshold: 10
          config:
            severity: warn
            store_failures: true
            database: rawdata
            schema: profiles
            alias: prev_to_current_FY_comparing            

      - comparing_profiles_test:
          profile_name_base: 'full_profile'
          profile_name_compared: '1_month_ago'
          metrics:
            - name: pct_nulls
              threshold: 10
            - name: pct_uniqs
              threshold: 10
            - name: vc_normalized_shannon_entropy
              threshold: 10              
            - name: num_mean
              threshold: 10
          config:
            severity: warn
            store_failures: true
            database: rawdata
            schema: profiles
            alias: full_to_1_month_ago_comparing

      - comparing_profiles_test:
          profile_name_base: '2_months_ago'
          profile_name_compared: '1_month_ago'
          metrics:
            - name: pct_nulls
              threshold: 10
            - name: pct_uniqs
              threshold: 10
            - name: vc_normalized_shannon_entropy
              threshold: 10              
            - name: num_mean
              threshold: 10
          config:
            severity: warn
            store_failures: true
            database: rawdata
            schema: profiles
            alias: months_comparing