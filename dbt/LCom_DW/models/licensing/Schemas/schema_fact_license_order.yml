---
version: 2
models:
  - name: fact_license_order
    description: "License Orders Fact table based on
      content_delivery_usage.staging.license_order (limited data from
      LearningPlatform.dbo.Order) table. The staging view filter EXCLUDES: COVID19
      orders,  Google Integration, Generic LTI Tool Consumer, Tech Apps TCEA
      Assessment MS 19/20+ SKUs and NOT valid orders. As on 20250325 only these
      orders are loaded in Redshift staging table: EnforceDateRestrictions=n or
      ExpirationDate>=cast(2024-01-01 as date)"
    config:
      contract:
        enforced: true
      tags:
        - fact

    columns:
      - name: order_id
        data_type: varchar(100)
        description: Primary Key of FACT_LICENSE_ORDER. LearningPlatform.dbo.[Order].OrderId
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        tests:
          - unique

      - name: sku_id
        data_type: varchar(100)
        description: DIM_PRODUCT FK TBD LearningPlatform.dbo.[Order].SkuId
        constraints:
          - type: not_null

      - name: organization_district_id
        data_type: varchar(300)
        description: DIM_ACCOUNT FK
        constraints:
          - type: not_null
          - type: foreign_key
            reference: ref('dim_account')
            warn_unenforced: false
        data_tests:
          - relationships:
              to: ref('dim_account')
              field: account_id      

      - name: startdate
        data_type: timestamp
        description: Order Start date LearningPlatform.dbo.[Order].Startdate
        constraints:
          - type: not_null

      - name: expirationdate
        data_type: timestamp
        description: Order Expiration date LearningPlatform.dbo.[Order].Expirationdate
        constraints:
          - type: not_null        

      - name: enforcedaterestrictions
        data_type: char(1)
        description: Enforce Date Restricts (n if startdate and expirationdate should be ignored) LearningPlatform.dbo.[Order].enforcedaterestrictions
        constraints:
          - type: not_null             


      - name: schoolcount
        data_type: integer
        description: Number of schools covered LearningPlatform.dbo.[Order].SchoolCount
        constraints:
          - type: not_null 

      - name: studentcount
        data_type: integer
        description: Number of licenses(students) LearningPlatform.dbo.[Order].StudentCount
        constraints:
          - type: not_null           

      - name: auditcreatedate
        data_type: timestamp
        description: Order Created date LearningPlatform.dbo.[Order].auditcreatedate
        constraints:
          - type: not_null   

      - name: auditupdatedate
        data_type: timestamp
        description: Order Modified date LearningPlatform.dbo.[Order].auditupdatedate
        constraints:
          - type: not_null 

      - name: loaddate
        data_type: timestamp
        description: The datetime the record was loaded
        constraints:
          - type: not_null            