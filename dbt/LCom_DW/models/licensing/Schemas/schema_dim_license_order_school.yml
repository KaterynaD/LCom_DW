---
version: 2
models:
  - name: dim_license_order_school
    description: "Bridge table: Only valid Schools in License Orders.
      Table materialization because incremental was causing too many maintenance (later arrival organizations) 
      and do not add a lot of speed to the refresh."
    config:
      contract:
        enforced: true    
      tags:
        - dim
        - licensing
    columns:
      - name: order_id
        data_type: varchar(100)
        description: FACT_LICENSE_ORDER FK LearningPlatform.dbo.Order_School.OrderId
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              to: ref('fact_license_order')
              field: order_id

      - name: organization_district_id
        data_type: varchar(300)
        description: Foreign key to DIM_ACCOUNT. Represents the district organization.
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              to: ref('dim_account')
              field: account_id

      - name: organization_school_id
        data_type: varchar(300)
        description: Foreign key to DIM_ACCOUNT. Represents the school organization.
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              to: ref('dim_account')
              field: account_id


      - name: auditcreatedate
        data_type: timestamp
        description: Timestamp when the record was created (audit field).
        constraints:
          - type: not_null

      - name: auditupdatedate
        data_type: timestamp
        description: Timestamp when the record was last updated (audit field).
        constraints:
          - type: not_null

      - name: loaddate
        data_type: timestamp
        description: Timestamp when the record was loaded into the data warehouse.
        constraints:
          - type: not_null