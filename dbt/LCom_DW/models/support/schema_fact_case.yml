version: 2

models:
  - name: fact_case
    description: Fact Case (Salesforce Case table)
    config:
      contract:
        enforced: true
      tags:
        - fact
        - support        

    columns:

      - name: case_id
        data_type: varchar(300)
        description: Case ID
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests:
          - unique

      - name: account_id
        data_type: varchar(300)
        description: Account ID
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              to: ref('dim_account')
              field: account_id

      - name: sfdc_account_id
        data_type: varchar(300)
        description: SFDC Account ID
        constraints:
          - type: not_null


      - name: case_number
        data_type: varchar(90)
        description: Case Number
        constraints:
          - type: not_null

      - name: case_owner_email
        data_type: varchar(400)
        description: Case Owner Email
        constraints:
          - type: not_null

      - name: closed_date
        data_type: timestamp
        description: Date/Time Closed
        constraints:
          - type: not_null

      - name: contact_id
        data_type: varchar(300)
        description: Contact ID
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              to: ref('dim_contact')
              field: contact_id          
    

      - name: created_date
        data_type: timestamp
        description: Created Date in PST timezone
        constraints:
          - type: not_null

      - name: description
        data_type: varchar(max)
        description: Case Description
        constraints:
          - type: not_null
            

      - name: is_closed
        data_type: boolean
        description: Is Closed
        constraints:
          - type: not_null

      - name: is_escalated
        data_type: boolean
        description: Is Escalated
        constraints:
          - type: not_null


      - name: last_modified_date
        data_type: timestamp
        description: Last Modified Date  in PST timezone
        constraints:
          - type: not_null



      - name: origin
        data_type: varchar(1000)
        description: Case Origin
        constraints:
          - type: not_null

      - name: owner_id
        data_type: varchar(300)
        description: Owner ID, DIM_EMPLOYEE FK
        constraints:
          - type: not_null
        data_data_tests:
          - relationships:
            to: ref('dim_employee')
            field: employee_id         

      - name: platform_name
        data_type: varchar(300)
        description: Platform Name
        constraints:
          - type: not_null

      - name: case_priority
        data_type: varchar(1000)
        description: Case Priority
        constraints:
          - type: not_null

      - name: support_type
        data_type: varchar(240)
        description: Support Type
        constraints:
          - type: not_null

      - name: solution
        data_type: varchar(5000)
        description: Solution
        constraints:
          - type: not_null

      - name: status
        data_type: varchar(100)
        description: Status
        constraints:
          - type: not_null

      - name: subject
        data_type: varchar(1000)
        description: Case Subject
        constraints:
          - type: not_null

      - name: case_type
        data_type: varchar(100)
        description: Case Type
        constraints:
          - type: not_null

      - name: loaddate
        data_type: timestamp
        description: The datetime the record was loaded in PST
        constraints:
          - type: not_null
