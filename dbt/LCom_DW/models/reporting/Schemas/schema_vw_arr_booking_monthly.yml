version: 2

models:
  - name: vw_arr_booking_monthly
    description: >

      Main ARR reporting view that combines ARR, Booking, and ARR Target data
      together with Opportunity, Account, Ultimate Parent Account, and Product attributes.

      The view is used for monthly ARR reporting and analysis across revenue movements,
      booking activity, and targets in a single reporting layer.

      It brings together calculated amounts from fact_arr, booking amounts from fact_booking,
      and monthly ARR targets, enriched with account hierarchy, account history,
      product attributes, and opportunity details.

    config:
      tags:
        - revenue
        - arr

    columns:
      - name: data_type
        description: >
          High-level data stream in the reporting view.
          Possible values include ARR, Booking, and ARR Target.


      - name: record_type
        description: >
          Record classification within the data stream, such as ARR, Booking, or Target,
          and other ARR movement record types from fact_arr.


      - name: mon_year
        description: >
          Reporting month in YYYYMM format.


      - name: mon_lastday
        description: >
          Last calendar day of the reporting month.


      - name: fiscalyear
        description: >
          Fiscal year for the ARR movement month in a form yyyy_start/yyyy_end.


      - name: fiscalyear_mon
        description: >
          Fiscal year and month representation used for reporting and grouping.


      - name: opportunity_id
        description: "{{ doc('column_opportunity_id') }}"


      - name: opportunity_number
        description: "{{ doc('column_opportunity_number') }}"


      - name: opportunity_name
        description: "{{ doc('column_opportnity_name') }}"


      - name: stage_name
        description: "{{ doc('column_stage_name') }}"


      - name: sfdc_account_id
        description: "{{ doc('column_sfdc_account_id') }}"


      - name: account_state_initiative
        description: "{{ doc('column_sfdc_state_initiative') }}"


      - name: sfdc_ultimate_parent_id
        description: "{{ doc('column_sfdc_ultimate_parent_id') }}"


      - name: ultimate_parent_account_state_initiative
        description: Ultimate parent account level "{{ doc('column_sfdc_state_initiative') }}"


      - name: invoiced_date
        description: "{{ doc('column_invoiced_date') }}"


      - name: close_date
        description: "{{ doc('column_close_date') }}"


      - name: start_date
        description: "{{ doc('column_start_date') }}"


      - name: end_date
        description: "{{ doc('column_end_date') }}"

      - name: start_date_adjusted
        description: ARR start date adjusted for ARR type retained for  data explanation.

      - name: end_date_adjusted
        description: ARR end date adjusted for ARR type retained for  data explanation.

      - name: renewal_start_date_adjusted
        description: ARR renewal start date adjusted for ARR type retained for data explanation.        

      - name: max_parent_end_date_adjusted
        description: Latest (maximum) parent end date adjusted for ARR type retained for data explanation.

      - name: arr_activation_date
        description: >
          Date when the ARR amount becomes active for reporting purposes.


      - name: arr_deactivation_date
        description: >
          Date when the ARR amount stops being active for reporting purposes.


      - name: renewal_opportunity_id
        description: Renewal opportunity "{{ doc('column_opportunity_id') }}"


      - name: renewal_stage_name
        description: Renewal opportunity "{{ doc('column_stage_name') }}"


      - name: renewal_invoiced_date
        description: Renewal opportunity "{{ doc('column_invoiced_date') }}"


      - name: renewal_close_date
        description: Renewal opportunity "{{ doc('column_close_date') }}"



      - name: renewal_start_date
        description: Renewal opportunity "{{ doc('column_start_date') }}"


      - name: renewal_end_date
        description: Renewal opportunity "{{ doc('column_end_date') }}"


      - name: bucket
        description: >
          Normalized bucket used for ARR, Booking, or Target classification.


      - name: bucket_sfdc
        description: >
          Original Salesforce bucket or bucket-equivalent classification.


      - name: total_price
        description: >
          Total price associated with the record before downstream aggregation or ARR transformation.


      - name: parent_total_price
        description: >
          Parent opportunity total price used in ARR comparison and renewal-related reporting.


      - name: amount
        description: >
          Final reporting amount.
          Represents ARR amount, booking amount, or target amount depending on data_type and record_type.


      - name: sfdc_product_id
        description: "{{ doc('column_sfdc_product_code') }}"


      - name: sfdc_product_name
        description: "{{ doc('column_sfdc_product_name') }}"


      - name: lcom_suite
        description: "{{ doc('column_lcom_suite') }}"


      - name: sfdc_product_family
        description: "{{ doc('column_sfdc_product_family') }}"


      - name: sfdc_product_sub_family
        description: "{{ doc('column_sfdc_product_sub_family') }}"

      - name: account_name
        description: "{{ doc('column_sfdc_name') }}"


      - name: ultimate_parent_account_name
        description: Ultimate parent account "{{ doc('column_sfdc_name') }}"


      - name: state
        description: "{{ doc('column_sfdc_billing_state') }}"


      - name: country
        description: "{{ doc('column_sfdc_billing_country') }}"


      - name: district_enrollment
        description: District or School level "{{ doc('column_sfdc_district_enrollment') }}"

      - name: state_initiative
        description: District or School level "{{ doc('column_sfdc_state_initiative') }}"


      - name: urban_rural
        description: "{{ doc('column_sfdc_urban_rural') }}"


      - name: current_account_owner_name
        description: "{{ doc('column_sfdc_owner_name_text') }}"