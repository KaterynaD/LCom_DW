models:
  - name: vw_arr_12_vs_1_start_fy_validation
    description: "The vw_arr_12_vs_1_start_fy_validation model is a validation view designed to compare the Annual Recurring Revenue (ARR) of Ultimate Parent Accounts between the last month of a fiscal year (month 12) and the first month of the subsequent fiscal year (month 1). It aggregates ARR data from two sources: the ending fiscal year month and the starting fiscal year month, identifies whether accounts are present in each month, and calculates the difference in ARR between these two periods. This model is useful for tracking ARR changes across fiscal years, identifying discrepancies, and ensuring data consistency in revenue reporting."
    columns:
      - name: sfdc_name
        description: "{{ doc('column_sfdc_name') }}"
      - name: sfdc_ultimate_parent_id
        description: "{{ doc('column_sfdc_ultimate_parent_id') }}"
      - name: mon_year_12
        description: Calendar year and month for ending ARR (month 12) in the form yyyymm
      - name: mon_year_1
        description: Calendar year month for starting ARR (month 1) in the form yyyymm
      - name: is_in_12
        description: Indicates if the account is present in fiscal year month 12.
      - name: is_in_1
        description: Indicates if the account is present in fiscal year month 1.
      - name: amount_12
        description: ARR amount for fiscal year month 12 and ultimate parent account
      - name: amount_1
        description: ARR amount for fiscal year month 1 and ultimate parent account
      - name: diff
        description: Difference between ARR in month 12 and month 1 and for ultimate parent account
