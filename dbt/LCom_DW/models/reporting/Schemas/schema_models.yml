---
version: 2
models:

  - name: vw_alive_accounts
    description: View to represent historical monthly and current basic info about accounts with opportunities, licenses or usage
    config:
      tags:
        - rep

  - name: vw_licenses_provisioning_monthly
    description: View to represent current monthly active licenses provisioned at district and school levels with a complex set of attributes
    config:
      tags:
        - rep        

  - name: get_weekly_snapshot_data_district_level
    description: View to use in Weekly Provisioning Licensing and Utilization dashboard
    config:
      tags:
        - rep

  - name: vw_dw_table_report
    description: Row counts and last action date for all tabless/views in DW database schemas. Direct table name instead of ref is used to eliminated lineage mess
    config:
      tags:
        - rep

  - name: vw_fivetran_sync_table_report
    description: Row counts and last fivetran sync date for all tables synced using fivetran. Direct table name instead of source is used to eliminated lineage mess and not all tables are used as source
    config:
      tags:
        - rep     

  - name: vw_salesforce_object_created_report
    description: Row counts and last created date for all salesforce tables synced using fivetran. Direct table name instead of source is used to eliminated lineage mess and not all tables are used as source
    config:
      tags:
        - rep              

  - name: vw_cdu_table_report
    description: Row counts and last action date for all tabless/views in CONTENT_DELIVERY_USAGE database schemas
    config:
      tags:
        - rep


  - name: vw_usage_scorecard
    description: Active Students and Launches in current School Year Month for scorecards dashboard
    config:
      tags:
        - rep

  - name: vw_licensing_scorecard
    description: Number of Districts, Schools and Students licenses in current School Year Month for scorecards dashboard
    config:
      tags:
        - rep

  - name: vw_licensing_monthly
    description: Historical numbers of Districts, Schools and Students licenses monthly
    config:
      tags:
        - rep        

  - name: vw_customer_scorecard
    description: Contract Active, Net Active and Total Active current, previous (the same month of a previous FY) and target  numbers of customers for scorecard dashboard
    config:
      tags:
        - rep        

  - name: vw_preliminary_customer_scorecard
    description: Contract Active, Net Active and Total Active current, previous (the same month of a previous FY) and target  numbers of customers based on Preliminary ARR for scorecard dashboard. It should replace vw_customer_scorecard model when it will no longer needed
    config:
      tags:
        - rep        
     

  - name: vw_paying_customers_monthly
    description: Historical Contract Active, Net Active and Total Active, New, Returning Churn customers with attributes for reporting
    config:
      tags:
        - rep             


  - name: vw_paying_customers_opportunities
    description: Opportunities details for customers reporting
    config:
      tags:
        - rep        
       
  - name: vw_revenue_scorecard
    description: ARR, NRR and GDR current, previous (end of a previous FY) and target for scorecard dashboard
    config:
      tags:
        - rep           

  - name: vw_revenue_monthly
    description: Opportunities contributing into to historical ARR, NRR, GRR and Booking monthly
    config:
      tags:
        - rep          

  - name: vw_opp_number_of_students
    description: Licenses/Students from Number of students in Closed Won Invoiced Opportunities
    config:
      tags:
        - rep

  - name: vw_contact_opportunity
    description: Opportunities for marketing contacts reporting
    config:
      tags:
        - rep        

  - name: vw_marketing_contacts
    description: Contacts for marketing reporting
    config:
      tags:
        - rep        
