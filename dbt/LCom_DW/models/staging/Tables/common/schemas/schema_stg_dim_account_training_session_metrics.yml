version: 2

models:
  - name: stg_dim_account_training_session_metrics
    description: >
      Account-level completed-session count and latest training-session date sourced directly
      from Salesforce training sessions. It is used by int_dim_account_sfdc for dim_account.
    config:
      tags:
        - common
        - staging
    columns:
      - name: account_id
      - name: total_training_sessions
      - name: latest_training_session_on
