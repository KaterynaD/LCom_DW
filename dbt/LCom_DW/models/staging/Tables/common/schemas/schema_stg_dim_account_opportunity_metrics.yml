version: 2

models:
  - name: stg_dim_account_opportunity_metrics
    description: >
      Account-level won and open opportunity metrics sourced directly from Salesforce opportunities.
      It is used by int_dim_account_sfdc to add opportunity activity and customer-since dates to dim_account.
    config:
      tags:
        - common
        - staging
    columns:
      - name: account_id
      - name: total_won_opportunities
      - name: total_open_opportunities
      - name: latest_start_date
      - name: latest_end_date
      - name: latest_open_opportunities_modified_date
      - name: first_invoiced_date
