version: 2

models:
  - name: stg_opportunities_chain_of_renewals
    description: >
      Staging table to keep opportunities chain of renewals IDs starting from the first (usually New or Upsell) using recursive query in staging.processing_opportunities_chain_of_renewals
      It's used to validate ARR.
    config:
      contract:
        enforced: false
      tags:
        - staging
        - revenue
        - arr     

    columns:
      - name: opportunity_id
        data_type: varchar(300)
        description: Opportunity Unique identifier.
        constraints:
          - type: not_null
        data_tests:
          - unique          

      - name: cnt_parents
        data_type: int
        description: Count of opportunities from which this one was renewed.
        constraints:
          - type: not_null

      - name: parent_opportunities
        data_type: varchar(max)
        description: Comma-separated list of opportunities from which this one was renewed. It starts from the first one (not renewed from any other opportunity). It supposed to be New or Upsell, but if the chain of renewals is broken, it can be Renewal. And ends with the opportunity_id for which the chain of renewals is built.
        constraints:
          - type: not_null

      - name: loaddate
        data_type: timestamp without time zone
        description: Timestamp of when the record was loaded.
        constraints:
          - type: not_null
