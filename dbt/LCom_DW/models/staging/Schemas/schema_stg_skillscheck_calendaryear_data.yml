version: 2

models:
  - name: stg_skillscheck_calendaryear_data
    description: Staging table to keep skills check data aggregated for each student by calendar year.
    column_types:
      schoolyear: varchar(20) not null
      country_code: char(2) null
      state_province_key: varchar(6) null
      organization_district_id: varchar(255) not null
      organization_school_id: varchar(255) null
      user_account_id: varchar(255) not null
      user_grade_level_code: char(2) null
      assessment_set_id: int not null
      level: varchar(10) not null
      skill: varchar(100) not null
      took_both: boolean not null
      pre_learning_object_id: varchar(50) null
      pre_score_datetime: timestamptz null
      pre_time_spent_seconds: int null
      pre_time_spent_seconds_capped: int null
      pre_score: int null
      pre_possible_score: int null
      pre_pct_score: numeric(8,6) null
      pre_performance_bucket: varchar(10) null
      post_learning_object_id: varchar(50) null
      post_score_datetime: timestamptz null
      post_time_spent_seconds: int null
      post_time_spent_seconds_capped: int null
      post_score: int null
      post_possible_score: int null
      post_pct_score: numeric(8,6) null
      post_performance_bucket: varchar(10) null
      score_change: int null
      pct_score_change: numeric(8,6) null
      pct_growth: numeric(8,6) null
      unique_items_completed_before: int null
      unique_items_completed_between: int null
    config:
      contract:
        enforced: true
      tags:
        - staging
        - cdu        

    columns:
      - name: year
        data_type: integer
        description: 'Calendar year for which the snapshot is taken.'
        constraints:
          - type: not_null

      - name: country_code
        data_type: char(2)
        description: ISO code for the country.

      - name: state_province_key
        data_type: varchar(6)
        description: Key for the state or province.

      - name: organization_district_id
        data_type: varchar(255)
        description: Identifier for the organization district.
        constraints:
          - type: not_null

      - name: organization_school_id
        data_type: varchar(255)
        description: Identifier for the organization school.

      - name: user_account_id
        data_type: varchar(255)
        description: Identifier for the user account.
        constraints:
          - type: not_null

      - name: user_grade_level_code
        data_type: char(2)
        description: Code representing the user's grade level.

      - name: assessment_set_id
        data_type: int
        description: Identifier for the assessment set (container for the pre and post test).
        constraints:
          - type: not_null

      - name: level
        data_type: varchar(10)
        description: Level of the assessment (E.g., Level 1, Levels 4-5, Level MS, etc.).
        constraints:
          - type: not_null

      - name: skill
        data_type: varchar(100)
        description: Skill being assessed.
        constraints:
          - type: not_null

      - name: took_both
        data_type: boolean
        description: Indicates whether the student took both the pre and post assessments.
        constraints:
          - type: not_null

      - name: pre_learning_object_id
        data_type: varchar(50)
        description: Identifier for the pre-learning object.

      - name: pre_score_datetime
        data_type: timestamptz
        description: Timestamp of when the pre-assessment score was recorded.

      - name: pre_time_spent_seconds
        data_type: int
        description: Time spent on the pre-assessment in seconds.

      - name: pre_time_spent_seconds_capped
        data_type: int
        description: Time spent on the pre-assessment in seconds, capped at a maximum value (3600).

      - name: pre_score
        data_type: int
        description: Score obtained in the pre-assessment.

      - name: pre_possible_score
        data_type: int
        description: Possible score for the pre-assessment.

      - name: pre_pct_score
        data_type: numeric(8,6)
        description: Percentage score for the pre-assessment.

      - name: pre_performance_bucket
        data_type: varchar(10)
        description: Performance bucket for the pre-assessment (e.g., Beginning, Developing, Proficient).

      - name: post_learning_object_id
        data_type: varchar(50)
        description: Identifier for the post-learning object.

      - name: post_score_datetime
        data_type: timestamptz
        description: Timestamp of when the post-assessment score was recorded.

      - name: post_time_spent_seconds
        data_type: int
        description: Time spent on the post-assessment in seconds.

      - name: post_time_spent_seconds_capped
        data_type: int
        description: Time spent on the post-assessment in seconds, capped at a maximum value (3600).

      - name: post_score
        data_type: int
        description: Score obtained in the post-assessment.

      - name: post_possible_score
        data_type: int
        description: Possible score for the post-assessment.

      - name: post_pct_score
        data_type: numeric(8,6)
        description: Percentage score for the post-assessment.

      - name: post_performance_bucket
        data_type: varchar(10)
        description: Performance bucket for the post-assessment (e.g., Beginning, Developing, Proficient).

      - name: score_change
        data_type: int
        description: Change in score from pre-assessment to post-assessment.

      - name: pct_score_change
        data_type: numeric(8,6)
        description: Percentage change in score from pre-assessment to post-assessment.

      - name: pct_growth
        datatype: numeric(8,6)
        description: Percentage growth from pre-assessment to post-assessment.

      - name: unique_items_completed_before
        data_type: int
        description: Number of unique items completed before the assessment.

      - name: unique_items_completed_between
        data_type: int
        description: Number of unique items completed between the pre-assessment and post-assessment.
