models:
  - name: stg_contract_active
    description: Customers from active, not expired contracts (opportunities) in the current month or have license_unenforced set to True. The table is used to provide Contract Active customers monthly for Customers analysis.                   
    config:
      contract:
        enforced: true
      tags:
        - customers
        - staging
        - revenue   


    columns:
      - name: record_type
        description: Contract Active
        data_type: varchar(20)
        constraints:
          - type: not_null

      - name: mon_year
        description: "{{ doc('column_revenue_mon_year') }}"
        data_type: integer
        constraints:
          - type: not_null        

      - name: mon_lastday
        description: "{{ doc('column_revenue_mon_lastday') }}"
        data_type: date
        constraints:
          - type: not_null        

      - name: fiscalyear
        description: "{{ doc('column_fiscalyear') }}"
        data_type: varchar(20)
        constraints:
          - type: not_null        

      - name: fiscalyear_mon
        description: "{{ doc('column_fiscalyear_mon') }}"
        data_type: integer
        constraints:
          - type: not_null        

      - name: opportunity_id
        description: "{{ doc('column_opportunity_id') }}"
        data_type: varchar(300)
        constraints:
          - type: not_null


      - name: sfdc_account_id
        description: "{{ doc('column_sfdc_account_id') }}"
        data_type: varchar(300)
        constraints:
          - type: not_null

      - name: sfdc_ultimate_parent_id
        description: "{{ doc('column_sfdc_ultimate_parent_id') }}"
        data_type: varchar(300)
        constraints:
          - type: not_null

      - name: amount
        description: "{{ doc('column_amount') }}"
        data_type: float
        constraints:
          - type: not_null

      - name: loaddate
        data_type: timestamp
        description: "{{ doc('column_loaddate') }}"
        constraints:
         - type: not_null 


