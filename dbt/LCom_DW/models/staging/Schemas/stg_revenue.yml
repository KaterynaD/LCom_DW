version: 2

models:
  - name: stg_revenue
    description: >-
      Staging model that aggregates revenue-related data from opportunity and lines. 
      Includes ARR, NRR, price increases, reductions, and cancellations, grouped by invoiced or close (Cancellation) 
      month and opportunity attributes. 
      It's used to create fact_revenue categories (ARR and Booking). 
      Price Increase, Reduction and Cancellation has approximate Biz Dev bucket separation.
    
    config:
      contract:
        enforced: true   
      tags:
        - staging
        - revenue
    
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - opportunity_id
            - mon_year
            - bucket
    
    columns:
      - name: mon_year
        description: "{{ doc('column_revenue_mon_year') }}"
        data_type: integer
        constraints:
          - type: not_null        

      - name: mon_lastday
        description: "{{ doc('column_revenue_mon_lastday') }}"
        data_type: date
        constraints:
          - type: not_null        

      - name: fiscalyear
        description: "{{ doc('column_fiscalyear') }}"
        data_type: varchar(20)
        constraints:
          - type: not_null        

      - name: fiscalyear_mon
        description: "{{ doc('column_fiscalyear_mon') }}"
        data_type: integer
        constraints:
          - type: not_null        

      - name: opportunity_id
        description: "{{ doc('column_opportunity_id') }}"
        data_type: varchar(300)
        constraints:
          - type: not_null

      - name: stage_name
        description: "{{ doc('column_stage_name') }}"
        data_type: varchar(780)
        constraints:
          - type: not_null

      - name: opp_record_type
        description: "{{ doc('column_opp_record_type') }}"
        data_type: varchar(20)
        constraints:
          - type: not_null

      - name: sfdc_account_id
        description: "{{ doc('column_sfdc_account_id') }}"
        data_type: varchar(300)
        constraints:
          - type: not_null

      - name: sfdc_state_initiative
        description: "{{ doc('column_sfdc_state_initiative') }}"
        data_type: boolean
        constraints:
          - type: not_null

      - name: sfdc_ultimate_parent_id
        description: "{{ doc('column_sfdc_ultimate_parent_id') }}"
        data_type: varchar(300)
        constraints:
          - type: not_null

      - name: invoiced_date
        description: "{{ doc('column_invoiced_date') }}"
        data_type: date
        constraints:
          - type: not_null

      - name: close_date
        description: "{{ doc('column_close_date') }}"
        data_type: date
        constraints:
          - type: not_null  

      - name: start_date
        description: "{{ doc('column_start_date') }}"
        data_type: date
        constraints:
          - type: not_null

      - name: end_date
        description: "{{ doc('column_end_date') }}"
        data_type: date
        constraints:
          - type: not_null

      - name: renewal_opportunity_id
        description: "{{ doc('column_renewal_opportunity_id') }}"
        data_type: varchar(300)
        constraints:
          - type: not_null

      - name: renewal_stage_name
        description: "{{ doc('column_renewal_stage_name') }}"
        data_type: varchar(780)
        constraints:
          - type: not_null

      - name: renewal_invoiced_date
        description: "{{ doc('column_renewal_invoiced_date') }}"
        data_type: date
        constraints:
          - type: not_null

      - name: renewal_close_date
        description: "{{ doc('column_renewal_close_date') }}"
        data_type: date
        constraints:
          - type: not_null

      - name: disable_auto_renewal_opp
        description: "{{ doc('column_disable_auto_renewal_opp') }}"
        data_type: boolean
        constraints:
          - type: not_null

      - name: license_unenforced
        description: "{{ doc('column_license_unenforced') }}"
        data_type: boolean
        constraints:
          - type: not_null

      - name: bucket
        description: "{{ doc('column_bucket') }}"
        data_type: varchar(765)
        constraints:
          - type: not_null

      - name: amount
        description: "{{ doc('column_amount') }}"
        data_type: numeric(38,10)
        constraints:
          - type: not_null

      - name: loaddate
        description: "{{ doc('column_loaddate') }}"
        data_type: timestamp
        constraints:
          - type: not_null 
