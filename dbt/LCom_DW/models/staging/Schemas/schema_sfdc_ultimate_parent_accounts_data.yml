version: 2

models:
  - name: sfdc_ultimate_parent_accounts_data
    description: >
      Staging table to keep ultimate parent accounts aggregated from child account info
      using recursive query in staging.processing_ultimate_parent_accounts SP. It's used to populate DIM_ACCOUNT table.
    config:
      contract:
        enforced: false
      tags:
        - staging
        - common        

    columns:
      - name: sfdc_ultimate_parent_id
        data_type: varchar(300)
        description: Unique identifier for the ultimate parent account from Salesforce. Only ultimate parent accounts with child's accounts opportunities (any stage) are included.
        constraints:
          - type: not_null
        data_tests:
          - unique          

      - name: sfdc_current_renewal_arr
        data_type: numeric(38,10)
        description: Aggregated current renewal ARR across all child accounts.
        constraints:
          - type: not_null

      - name: cnt_childs
        data_type: int
        description: Count of child accounts under the ultimate parent.
        constraints:
          - type: not_null

      - name: child_accounts
        data_type: varchar(max)
        description: Comma-separated list of child account IDs under the ultimate parent.
        constraints:
          - type: not_null

      - name: loaddate
        data_type: timestamp without time zone
        description: Timestamp of when the record was loaded.
        constraints:
          - type: not_null
