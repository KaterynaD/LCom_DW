version: 2
models:
  - name: dim_training_session_topic
    description: Mapping table between training sessions and topics. Each record links a training session to a topic, with load timestamp. Used for analyzing topic coverage across sessions.
    config:
      contract:
        enforced: true
      tags:
        - dim
        - training
    columns:
      - name: training_session_id
        data_type: varchar(300)
        description: Foreign key to fact_training_session; unique identifier for the training session.
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              to: ref('fact_training_session')
              field: training_session_id
      - name: topic_id
        data_type: varchar(300)
        description: Foreign key to dim_topic; unique topic identifier (MD5 hash of topic name).
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              to: ref('dim_topic')
              field: topic_id
      - name: loaddate
        data_type: timestamp
        description: "{{ doc('column_loaddate') }}"
        constraints:
          - type: not_null
