---
version: 2

models:
  - name: dim_lcom_sku_learning_object
    description: Relations between SKU and Learnining Objects (Curriculum Items - Lessons). Units and Sequences (intermediate objects) are skipped.
    config:
      contract:
        enforced: true
    tags:
      - fact
      - content_delivery_usage

    columns:
      - name: sku_id
        data_type: varchar(50)
        description: FK to DIM_LCOM_SKU (Products)
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              to: ref('dim_lcom_sku')
              field: sku_id
      - name: learning_object_id
        data_type: varchar(50)
        description: FK to DIM_LEARNING_OBJECT (Lessons)
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              to: ref('dim_learning_object')
              field: learning_object_id         
      - name: loaddate
        data_type: timestamp
        description: The datetime the record was loaded (PST)
        constraints:
          - type: not_null                 