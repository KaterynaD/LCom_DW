version: 2

models:
  - name: fact_training_session
    description: "Fact table for training sessions based on Salesforce Training Session object. Contains information about training sessions, including dates, locations, participants, and various attributes related to the training."
    config:
      contract:
        enforced: true
      tags:
      - fact
      - training 
    
    columns:
      - name: training_session_id
        data_type: VARCHAR(300)
        description: "{{ doc('column_training_session_id') }}"
        constraints:
        - type: not_null
        - type: primary_key
          warn_unenforced: false
        data_tests:
        - unique

      - name: name
        data_type: VARCHAR(240)
        description: "{{ doc('column_name') }}"
        constraints:
          - type: not_null

      - name: account_id
        data_type: VARCHAR(300)
        description: "{{ doc('column_account_id') }}"
        constraints:
        - type: not_null
        data_tests:
        - relationships:
            to: ref('dim_account')
            field: account_id

      - name: sfdc_account_id
        data_type: VARCHAR(300)
        description: "{{ doc('column_sfdc_account_id') }}"
        constraints:
          - type: not_null

      - name: owner_id
        data_type: VARCHAR(300)
        description: "{{ doc('column_owner_id') }}"
        constraints:
          - type: not_null
        data_tests:
        - relationships:
            to: ref('dim_employee')
            field: employee_id

      - name: pds_group
        data_type: VARCHAR(33)
        description: "{{ doc('column_pds_group') }}"
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              values: ['Professional Development Services', 'Service And Training', 'Assigned to an owner']

      - name: alternate_end_date
        data_type: DATE
        description: "{{ doc('column_alternate_end_date') }}"
        constraints:
          - type: not_null

      - name: alternate_end_time_unrestricted
        data_type: VARCHAR(765)
        description: "{{ doc('column_alternate_end_time_unrestricted') }}"
        constraints:
          - type: not_null

      - name: alternate_start_date
        data_type: DATE
        description: "{{ doc('column_alternate_start_date') }}"
        constraints:
          - type: not_null

      - name: alternate_start_time_unrestricted
        data_type: VARCHAR(765)
        description: "{{ doc('column_alternate_start_time_unrestricted') }}"
        constraints:
          - type: not_null

      - name: cancel_reason
        data_type: VARCHAR(765)
        description: "{{ doc('column_cancel_reason') }}"
        constraints:
          - type: not_null

      - name: closed_date
        data_type: DATE
        description: "{{ doc('column_closed_date') }}"
        constraints:
          - type: not_null

      - name: created_by_id
        data_type: VARCHAR(18)
        description: "{{ doc('column_created_by_id') }}"
        constraints:
          - type: not_null

      - name: created_date
        data_type: TIMESTAMP WITHOUT TIME ZONE
        description: "{{ doc('column_created_date') }}"
        constraints:
          - type: not_null

      - name: curriculum_examples
        data_type: VARCHAR(4099)
        description: "{{ doc('column_curriculum_examples') }}"
        constraints:
          - type: not_null

      - name: district_library
        data_type: VARCHAR(765)
        description: "{{ doc('column_district_library') }}"
        constraints:
          - type: not_null

      - name: end_date
        data_type: DATE
        description: "{{ doc('column_ts_end_date') }}"
        constraints:
          - type: not_null

      - name: experience_level
        data_type: VARCHAR(4099)
        description: "{{ doc('column_experience_level') }}"
        constraints:
          - type: not_null

      - name: impelmentation_i_pad_usage
        data_type: VARCHAR(4099)
        description: "{{ doc('column_impelmentation_i_pad_usage') }}"
        constraints:
          - type: not_null

      - name: implementation_advanced_topics
