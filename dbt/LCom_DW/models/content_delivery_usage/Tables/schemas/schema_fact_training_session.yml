version: 2

models:
  - name: fact_training_session
    description: "Fact table for training sessions based on Salesforce Training Session object. Contains information about training sessions, including dates, locations, participants, and various attributes related to the training."
    config:
      contract:
        enforced: true
      tags:
      - fact
      - training 
    
    columns:
      - name: training_session_id
        data_type: VARCHAR(300)
        description: "{{ doc('column_training_session_id') }}"
        constraints:
        - type: not_null
        - type: primary_key
          warn_unenforced: false
        data_tests:
        - unique

      - name: name
        data_type: VARCHAR(240)
        description: "{{ doc('column_training_name') }}"
        constraints:
          - type: not_null

      - name: account_id
        data_type: VARCHAR(300)
        description: "{{ doc('column_account_id') }}"
        constraints:
        - type: not_null
        data_tests:
          - relationships:
              to: ref('dim_account')
              field: account_id

      - name: sfdc_account_id
        data_type: VARCHAR(300)
        description: "{{ doc('column_sfdc_account_id') }}"
        constraints:
          - type: not_null



      - name: owner_id
        data_type: VARCHAR(300)
        description: "{{ doc('column_owner_id') }}"
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              to: ref('dim_employee')
              field: employee_id

      - name: pds_group
        data_type: VARCHAR(33)
        description: "{{ doc('column_pds_group') }}"
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              values: ['Professional Development Services', 'Service And Training', 'Assigned to an owner']


      - name: cancel_reason
        data_type: VARCHAR(765)
        description: "{{ doc('column_cancel_reason') }}"
        constraints:
          - type: not_null

      - name: closed_date
        data_type: DATE
        description: "{{ doc('column_closed_date') }}"
        constraints:
          - type: not_null

      - name: created_by_id
        data_type: VARCHAR(18)
        description: "{{ doc('column_created_by_id') }}"
        constraints:
          - type: not_null

      - name: created_date
        data_type: TIMESTAMP WITHOUT TIME ZONE
        description: "{{ doc('column_created_date') }}"
        constraints:
          - type: not_null

      - name: curriculum_examples
        data_type: VARCHAR(4099)
        description: "{{ doc('column_curriculum_examples') }}"
        constraints:
          - type: not_null

      - name: end_date
        data_type: DATE
        description: "{{ doc('column_ts_end_date') }}"
        constraints:
          - type: not_null

      - name: implementation_google_classroom
        data_type: VARCHAR(765)
        description: "{{ doc('column_implementation_google_classroom') }}"
        constraints:
          - type: not_null

      - name: implementation_notes
        data_type: VARCHAR(65535)
        description: "{{ doc('column_implementation_notes') }}"
        constraints:
          - type: not_null

      - name: implementation_statement
        data_type: VARCHAR(65535)
        description: "{{ doc('column_implementation_statement') }}"
        constraints:
          - type: not_null

      - name: implementation_topics
        data_type: VARCHAR(4099)
        description: "{{ doc('column_implementation_topics') }}"
        constraints:
          - type: not_null

      - name: implementation_type
        data_type: VARCHAR(765)
        description: "{{ doc('column_implementation_type') }}"
        constraints:
          - type: not_null

      - name: implementing_grades
        data_type: VARCHAR(4099)
        description: "{{ doc('column_implementing_grades') }}"
        constraints:
          - type: not_null

      - name: is_closed
        data_type: BOOLEAN
        description: "{{ doc('column_is_closed') }}"
        constraints:
          - type: not_null

      - name: last_modified_by_id
        data_type: VARCHAR(18)
        description: "{{ doc('column_last_modified_by_id') }}"
        constraints:
          - type: not_null

      - name: last_modified_date
        data_type: TIMESTAMP WITHOUT TIME ZONE
        description: "{{ doc('column_last_modified_date') }}"
        constraints:
          - type: not_null

      - name: notes
        data_type: VARCHAR(65535)
        description: "{{ doc('column_notes') }}"
        constraints:
          - type: not_null


      - name: primary_contact
        data_type: VARCHAR(363)
        description: "{{ doc('column_primary_contact') }}"
        constraints:
          - type: not_null

      - name: secondary_contact
        data_type: VARCHAR(363)
        description: "{{ doc('column_secondary_contact') }}"
        constraints:
          - type: not_null

      - name: session_attendee_count
        data_type: DOUBLE PRECISION
        description: "{{ doc('column_session_attendee_count') }}"
        constraints:
          - type: not_null

      - name: session_grades_attending
        data_type: VARCHAR(4099)
        description: "{{ doc('column_session_grades_attending') }}"
        constraints:
          - type: not_null

      - name: session_location_address
        data_type: VARCHAR(65535)
        description: "{{ doc('column_session_location_address') }}"
        constraints:
          - type: not_null


      - name: session_notes
        data_type: VARCHAR(65535)
        description: "{{ doc('column_session_notes') }}"
        constraints:
          - type: not_null

      - name: session_participation_method
        data_type: VARCHAR(765)
        description: "{{ doc('column_session_participation_method') }}"
        constraints:
          - type: not_null

      - name: session_subtype
        data_type: VARCHAR(765)
        description: "{{ doc('column_session_subtype') }}"
        constraints:
          - type: not_null

      - name: session_type
        data_type: VARCHAR(765)
        description: "{{ doc('column_session_type') }}"
        constraints:
          - type: not_null


      - name: start_date
        data_type: TIMESTAMP
        description: "{{ doc('column_ts_start_date') }}"
        constraints:
          - type: not_null


      - name: status
        data_type: VARCHAR(765)
        description: "{{ doc('column_ts_status') }}"
        constraints:
          - type: not_null

      - name: survey_action_items
        data_type: VARCHAR(765)
        description: "{{ doc('column_survey_action_items') }}"
        constraints:
          - type: not_null

      - name: survey_administrator_attendance
        data_type: VARCHAR(765)
        description: "{{ doc('column_survey_administrator_attendance') }}"
        constraints:
          - type: not_null

      - name: survey_attendee_challenges
        data_type: VARCHAR(765)
        description: "{{ doc('column_survey_attendee_challenges') }}"
        constraints:
          - type: not_null

      - name: requestor_id
        data_type: varchar(300)
        description: "{{ doc('column_requestor_id') }}"
        constraints:
          - type: not_null          

      - name: survey_attendee_count
        data_type: DOUBLE PRECISION
        description: "{{ doc('column_survey_attendee_count') }}"
        constraints:
          - type: not_null

      - name: survey_notable_discussions
        data_type: VARCHAR(65535)
        description: "{{ doc('column_survey_notable_discussions') }}"
        constraints:
          - type: not_null

      - name: survey_notes
        data_type: VARCHAR(65535)
        description: "{{ doc('column_survey_notes') }}"
        constraints:
          - type: not_null

      - name: survey_outcome_as_planned
        data_type: VARCHAR(765)
        description: "{{ doc('column_survey_outcome_as_planned') }}"
        constraints:
          - type: not_null

      - name: survey_outcome_issues
        data_type: VARCHAR(4099)
        description: "{{ doc('column_survey_outcome_issues') }}"
        constraints:
          - type: not_null

      - name: survey_recommendations
        data_type: VARCHAR(65535)
        description: "{{ doc('column_survey_recommendations') }}"
        constraints:
          - type: not_null

      - name: survey_teacher_engagement
        data_type: VARCHAR(765)
        description: "{{ doc('column_survey_teacher_engagement') }}"
        constraints:
          - type: not_null

      - name: survey_teacher_sentiment
        data_type: VARCHAR(765)
        description: "{{ doc('column_survey_teacher_sentiment') }}"
        constraints:
          - type: not_null

      - name: loaddate
        data_type: timestamp
        description: "{{ doc('column_loaddate') }}"
        constraints:
          - type: not_null
