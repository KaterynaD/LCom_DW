---
version: 2

models:
  - name: fact_launches_monthly_snapshots
    description: >
      Cumulative activity from the start of a school year (YTD) till end of month
      per student aggregated to the school level. It's populated with lc_load_launches_monthly_snapshots stored procedure
    config:
      contract:
        enforced: false
    tags:
      - fact

    columns:
      - name: mon_lastday
        data_type: date
        description: "Last day of a month"
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: organization_district_id
        data_type: varchar(255)
        description: >
          Organization.Parent_Organization_ID because 
          content_delivery_usage.dbo.fact_assignment_launch.organization_district_id 
          can be different for the same school in the historical perspective.
        constraints:
          - type: not_null

        data_tests:
          - not_null
          - relationships:
              to: ref('dim_account')
              field: account_id 

      - name: organization_school_id
        data_type: varchar(255)
        description: "content_delivery_usage.dbo.fact_assignment_launch.organization_school_id"
        constraints:
          - type: not_null

        data_tests:
          - not_null
          - relationships:
              to: ref('dim_account')
              field: account_id 

      - name: active_students_ytd
        data_type: integer
        description: >
          Unique number of students for a specific school since the start of the 
          current school year till end of a month.
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: launches_ytd
        data_type: integer
        description: >
          Number of launches from a specific school since the start of the 
          current school year till end of a month.
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: distinctitemsstudent_ytd
        data_type: integer
        description: >
          Unique number of curriculum items loaded by users since the start of 
          the current school year till end of a month, summarized at the school level.
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: active_students_month
        data_type: integer
        description: >
          Difference between current and previous month Active_Students_YTD.
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: launches_month
        data_type: integer
        description: >
          Difference between current and previous month Launches_YTD.
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: distinctitemsstudent_month
        data_type: integer
        description: >
          Difference between current and previous month DistinctItemsStudent_YTD.
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: loaddate
        data_type: timestamp
        description: "Timestamp when the record was loaded."
        constraints:
          - type: not_null
        data_tests:
          - not_null