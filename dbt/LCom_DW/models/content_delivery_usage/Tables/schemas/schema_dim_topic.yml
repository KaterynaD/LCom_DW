version: 2
models:
  - name: dim_topic
    description: Dimension table for unique training session topics. Each topic is assigned a unique topic_id (MD5 hash of topic name) and includes the topic text. Built from distinct topics in training sessions.
    config:
      contract:
        enforced: true
      tags:
        - dim
        - training
    columns:
      - name: topic_id
        data_type: varchar(300)
        description: Unique topic identifier (MD5 hash of topic name). Primary key.
        constraints:
          - type: not_null
          - type: primary_key
            warn_unenforced: false
        data_tests:
          - unique
      - name: topic
        data_type: varchar(200)
        description: Individual topic extracted from training session implementation_topics.
        constraints:
          - type: not_null

      - name: loaddate
        data_type: timestamp
        description: "{{ doc('column_loaddate') }}"
        constraints:
          - type: not_null

