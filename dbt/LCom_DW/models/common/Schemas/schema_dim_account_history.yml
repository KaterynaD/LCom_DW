version: 2
models:
- name: dim_account_history
  data_tests:
  - scd2_plus_validation:
      unique_key: account_id
      scd_valid_from_col_name: fromdate
      scd_valid_to_col_name: todate
  description: Dim Account history table (Slowly Changing Dimension Type 2).
  config:
    contract:
      enforced: false
    tags:
    - dim
    - common
  columns:
  - name: account_hist_id
    data_type: varchar(50)
    description: Primary Key of DIM_ACCOUNT_HISTORY
    constraints:
    - type: not_null
    - type: primary_key
      warn_unenforced: false
    data_tests:
    - not_null
    - unique
  - name: fromdate
    data_type: timestamp
    description: "{{ doc('column_fromdate') }}"
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: todate
    data_type: timestamp
    description: "{{ doc('column_todate') }}"
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: record_version
    data_type: integer
    description: "{{ doc('column_record_version') }}"
    constraints:
    - type: not_null
    data_tests:
    - not_null
  - name: account_id
    data_type: varchar(300)
    description: "{{ doc('column_account_id') }}"
    constraints:
    - type: not_null
    data_tests:
    - not_null
    - relationships:
        to: ref('dim_account')
        field: account_id
  - name: lcom_trial
    data_type: integer
    description: "{{ doc('column_lcom_trial') }}"
    constraints:
    - type: not_null
    data_tests:
    - not_null
