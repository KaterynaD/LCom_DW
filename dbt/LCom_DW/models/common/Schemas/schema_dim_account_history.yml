version: 2
models:
- name: int_account_history
  description: An ephemeral, intermediate model to be used in the Dim Account history table (Slowly Changing Dimension Type 2) model and scd2_current_matches_source test.
- name: dim_account_history
  description: Dim Account history table (Slowly Changing Dimension Type 2).
  data_tests:
  - scd2_plus_validation:
      unique_key: account_id
      scd_valid_from_col_name: fromdate
      scd_valid_to_col_name: todate
  
  - no_consecutive_duplicate_scd_hash:
      unique_key: account_id    

  - scd2_current_matches_source:
      source_model: int_account_history
      unique_key: account_id        
      scd_valid_to_col_name: todate
      scd_valid_to_max_date: '3000-12-31'
      check_cols:
        - lcom_organization_id
        - lcom_trial
        - lcom_demo
        - lcom_country_name
        - lcom_organization_name
        - lcom_organization_type
        - lcom_parent_organization_name
        - lcom_state_province_code
        - sfdc_parent_id
        - sfdc_record_type
        - sfdc_current_renewal_arr
        - sfdc_state_initiative
        - sfdc_state_initiative_school
        - sfdc_owner_id
        - sfdc_owner_name_text
        - sfdc_billing_state
        - sfdc_billing_state_code
        - sfdc_grade_levels
        - sfdc_k_12_enrollment
        - sfdc_k_8_enrollment
        - sfdc_name
        - sfdc_parent_name
        - sfdc_ultimate_account_owner
        - sfdc_ultimate_parent_account
        - sfdc_ultimate_parent_billing_state
        - sfdc_ultimate_parent_id
        - sfdc_urban_rural
        - ishighschool
        - sfdc_billing_country
        - sfdc_billing_country_code
        - sfdc_district_enrollment
        - sfdc_school_enrollment
        - sfdc_state_program_eligible
        - sfdc_county_name
        - sfdc_customer_level
        - sfdc_customer_level_override
        - lcom_parent_organization_id

  config:
    contract:
      enforced: false
    tags:
    - dim
    - common
  columns:
  - name: account_hist_id
    data_type: varchar(50)
    description: Primary Key of DIM_ACCOUNT_HISTORY
    constraints:
    - type: not_null
    - type: primary_key
      warn_unenforced: false
    data_tests:
    - unique
  - name: fromdate
    data_type: timestamp
    description: "{{ doc('column_fromdate') }}"
    constraints:
    - type: not_null

  - name: todate
    data_type: timestamp
    description: "{{ doc('column_todate') }}"
    constraints:
    - type: not_null

  - name: record_version
    data_type: integer
    description: "{{ doc('column_record_version') }}"
    constraints:
    - type: not_null

  - name: account_id
    data_type: varchar(300)
    description: "{{ doc('column_account_id') }}"
    constraints:
    - type: not_null


  - name: lcom_trial
    data_type: integer
    description: "{{ doc('column_lcom_trial') }}"
    constraints:
    - type: not_null

  - name: lcom_demo
    data_type: integer
    description: "{{ doc('column_lcom_demo') }}"
    constraints:
    - type: not_null

  - name: sfdc_parent_id
    data_type: varchar(300)
    description: "{{ doc('column_sfdc_parent_id') }}"
    constraints:
    - type: not_null

  - name: sfdc_record_type
    data_type: varchar(780)
    description: "{{ doc('column_sfdc_record_type') }}"
    constraints:
    - type: not_null

  - name: sfdc_current_renewal_arr
    data_type: numeric(16,2)
    description: "{{ doc('column_sfdc_current_renewal_arr') }}"
    constraints:
    - type: not_null

  - name: sfdc_state_initiative
    data_type: integer
    description: "{{ doc('column_sfdc_state_initiative') }}"
    constraints:
    - type: not_null

  - name: sfdc_state_initiative_school
    data_type: integer
    description: "{{ doc('column_sfdc_state_initiative_school') }}"
    constraints:
    - type: not_null

  - name: sfdc_owner_id
    data_type: varchar(30)
    description: "{{ doc('column_sfdc_owner_id') }}"
    constraints:
    - type: not_null

  - name: sfdc_owner_name_text
    data_type: varchar(380)
    description: "{{ doc('column_sfdc_owner_name_text') }}"
    constraints:
    - type: not_null



  - name: lcom_organization_id
