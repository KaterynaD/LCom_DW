version: 2
models:
- name: dim_employee
  description: Employee dimension table sourced from Salesforce User data
  config:
    contract:
      enforced: true
    tags:
    - dim
    - common
  columns:
  - name: employee_id
    data_type: varchar(300)
    description: Unique employee identifier (primary key)
    constraints:
    - type: not_null
    - type: primary_key
      warn_unenforced: false
    data_tests:
    - unique
  - name: name
    data_type: varchar(400)
    description: "{{ doc('column_employee_name') }}"
    constraints:
    - type: not_null
  - name: alias
    data_type: varchar(25)
    description: "{{ doc('column_alias') }}"
    constraints:
    - type: not_null
  - name: community_nickname
    data_type: varchar(400)
    description: "{{ doc('column_community_nickname') }}"
    constraints:
    - type: not_null
  - name: username
    data_type: varchar(240)
    description: "{{ doc('column_username') }}"
    constraints:
    - type: not_null
  - name: department
    data_type: varchar(240)
    description: "{{ doc('column_department') }}"
    constraints:
    - type: not_null
  - name: title
    data_type: varchar(240)
    description: "{{ doc('column_title') }}"
    constraints:
    - type: not_null
  - name: user_role
    data_type: varchar(240)
    description: "{{ doc('column_user_role') }}"
    constraints:
    - type: not_null
  - name: email
    data_type: varchar(400)
    description: "{{ doc('column_email') }}"
    constraints:
    - type: not_null
  - name: is_active
    data_type: boolean
    description: "{{ doc('column_is_active') }}"
    constraints:
    - type: not_null
  - name: last_login_date
    data_type: TIMESTAMP WITHOUT TIME ZONE
    description: "{{ doc('column_last_login_date') }}"
    constraints:
    - type: not_null
  - name: created_date
    data_type: TIMESTAMP WITHOUT TIME ZONE
    description: "{{ doc('column_created_date') }}"
    constraints:
    - type: not_null
  - name: last_modified_date
    data_type: TIMESTAMP WITHOUT TIME ZONE
    description: "{{ doc('column_last_modified_date') }}"
    constraints:
    - type: not_null
  - name: loaddate
    data_type: TIMESTAMP WITHOUT TIME ZONE
    description: "{{ doc('column_loaddate') }}"
    constraints:
    - type: not_null
