version: 2
models:
- name: dim_sfdc_product
  description: Salesforce Product Dimension Table
  config:
    contract:
      enforced: true
    tags:
    - dim
  columns:
  - name: sfdc_product_id
    data_type: varchar(50)
    description: Unique SFDC Product identifier, Primary Key.
    constraints:
    - type: not_null
    - type: primary_key
      warn_unenforced: false
    data_tests:
    - unique
  - name: sfdc_product_name
    data_type: varchar(765)
    description: SFDC Product Name
    constraints:
    - type: not_null
  - name: is_active
    data_type: boolean
    description: Active
    constraints:
    - type: not_null
  - name: active_in_platform
    data_type: boolean
    description: Active in Platform (Denotes if a given product has an active SKU
      on the Learning.com platform)
    constraints:
    - type: not_null
  - name: sbqq_component
    data_type: boolean
    description: Component (Marks this product as a component, excluding it from selection
      in product lookup.)
    constraints:
    - type: not_null
  - name: sbqq_cost_editable
    data_type: boolean
    description: Cost Editable (Controls whether cost for this product may be modified
      on individual quotes.)
    constraints:
    - type: not_null
  - name: created_date
    data_type: timestamp
    description: Created Date PST timestamp
    constraints:
    - type: not_null
  - name: does_not_prorate
    data_type: boolean
    description: Does not Prorate (Denotes if a product does not prorate based on
      subscription period)
    constraints:
    - type: not_null
  - name: sbqq_exclude_from_maintenance
    data_type: boolean
    description: Exclude From Percent Of Total (Excludes this product from percent
      of total maintenance calculations.)
    constraints:
    - type: not_null
  - name: sbqq_hidden
    data_type: boolean
    description: Hidden (Excludes this product from appearing on the quote PDF.)
    constraints:
    - type: not_null
  - name: sbqq_include_in_maintenance
    data_type: boolean
    description: 'Include In Percent Of Total (Includes products in percent of total
      calculations that are normally excluded (e.g.: subscription products).)'
    constraints:
    - type: not_null
  - name: is_not_provisioned
    data_type: boolean
    description: Is Not Provisioned (Denotes if a product is sold but is not provisioned
      within the learning.com platform. Applies to PD, misc fees, and tiered service
      product items. Removes these items from the licensing flow.)
    constraints:
    - type: not_null
  - name: last_modified_date
    data_type: timestamp
    description: Last Modified Date
    constraints:
    - type: not_null
  - name: lcom_suite
    data_type: varchar(250)
    description: LCOM Suite (The associated LCOM Suite of this product for provisioning
      purposes)
    constraints:
    - type: not_null
  - name: multiplier
    data_type: double precision
    description: Multiplier (Multiplier for auto-generating the correct license count
      based on quote lines)
    constraints:
    - type: not_null
  - name: netsuite_link
    data_type: varchar(190)
    description: Netsuite Link
    constraints:
    - type: not_null
  - name: net_suite_sku
    data_type: varchar(90)
    description: NetSuite SKU
    constraints:
    - type: not_null
  - name: sbqq_non_discountable
    data_type: boolean
    description: Non Discountable (Marks this product as non discountable.)
    constraints:
    - type: not_null
  - name: nyc_license_quantity
    data_type: double precision
    description: NYC License Quantity (Licenses included in product for NYC Price
      Book)
    constraints:
    - type: not_null
  - name: price_dimensions
    data_type: varchar(765)
    description: Price Dimensions
    constraints:
    - type: not_null
  - name: sbqq_price_editable
    data_type: boolean
    description: Price Editable (Indicates this product allows for price to be freely
      editable when building a quote)
    constraints:
    - type: not_null
  - name: sbqq_pricing_method
    data_type: varchar(765)
    description: Pricing Method (Pricing method that should be applied to this product.)
    constraints:
    - type: not_null
  - name: sfdc_product_code
    data_type: varchar(765)
    description: Product Code
    constraints:
    - type: not_null
  - name: sfdc_product_description
    data_type: varchar(4000)
    description: Product Description
    constraints:
    - type: not_null
  - name: sfdc_product_family
    data_type: varchar(765)
    description: Product Family
    constraints:
    - type: not_null
  - name: sfdc_product_sub_family
    data_type: varchar(765)
    description: Product Sub Family
    constraints:
    - type: not_null
  - name: sbqq_quantity_editable
    data_type: boolean
    description: Quantity Editable (Flag that determines whether the quantity is editable.)
    constraints:
    - type: not_null
  - name: sbqq_subscription_term
    data_type: double precision
    description: Subscription Term (Term length of this subscription. Only applicable
      if the product is a subscription.)
    constraints:
    - type: not_null
  - name: sbqq_subscription_type
    data_type: varchar(765)
    description: Subscription Type (Renewable Subscriptions will transfer to Renewal
      Quotes. One-time Subscriptions will not.)
    constraints:
    - type: not_null
  - name: vidcode_org_id
    data_type: varchar(75)
    description: Vidcode Org Id
    constraints:
    - type: not_null
  - name: loaddate
    data_type: timestamp
    description: The datetime the record was loaded (PST)
    constraints:
    - type: not_null
