version: 2
models:
- name: dim_sfdc_product
  description: Salesforce Product Dimension Table
  config:
    contract:
      enforced: true
    tags:
    - dim
    - common
  columns:
  - name: sfdc_product_id
    data_type: varchar(50)
    description: Unique SFDC Product identifier, Primary Key.
    constraints:
    - type: not_null
    - type: primary_key
      warn_unenforced: false
    data_tests:
    - unique
  - name: sfdc_product_name
    data_type: varchar(765)
    description: "{{ doc('column_sfdc_product_name') }}"
    constraints:
    - type: not_null
  - name: is_active
    data_type: boolean
    description: "{{ doc('column_is_active') }}"
    constraints:
    - type: not_null
  - name: active_in_platform
    data_type: boolean
    description: "{{ doc('column_active_in_platform') }}"
    constraints:
    - type: not_null
  - name: sbqq_component
    data_type: boolean
    description: "{{ doc('column_sbqq_component') }}"
    constraints:
    - type: not_null
  - name: sbqq_cost_editable
    data_type: boolean
    description: "{{ doc('column_sbqq_cost_editable') }}"
    constraints:
    - type: not_null
  - name: created_date
    data_type: timestamp
    description: "{{ doc('column_created_date') }}"
    constraints:
    - type: not_null
  - name: does_not_prorate
    data_type: boolean
    description: "{{ doc('column_does_not_prorate') }}"
    constraints:
    - type: not_null
  - name: sbqq_exclude_from_maintenance
    data_type: boolean
    description: "{{ doc('column_sbqq_exclude_from_maintenance') }}"
    constraints:
    - type: not_null
  - name: sbqq_hidden
    data_type: boolean
    description: "{{ doc('column_sbqq_hidden') }}"
    constraints:
    - type: not_null
  - name: sbqq_include_in_maintenance
    data_type: boolean
    description: "{{ doc('column_sbqq_include_in_maintenance') }}"
    constraints:
    - type: not_null
  - name: is_not_provisioned
    data_type: boolean
    description: "{{ doc('column_is_not_provisioned') }}"
    constraints:
    - type: not_null
  - name: last_modified_date
    data_type: timestamp
    description: "{{ doc('column_last_modified_date') }}"
    constraints:
    - type: not_null
  - name: lcom_suite
    data_type: varchar(250)
    description: "{{ doc('column_lcom_suite') }}"
    constraints:
    - type: not_null
  - name: multiplier
    data_type: double precision
    description: "{{ doc('column_multiplier') }}"
    constraints:
    - type: not_null
  - name: netsuite_link
    data_type: varchar(190)
    description: "{{ doc('column_netsuite_link') }}"
    constraints:
    - type: not_null
  - name: net_suite_sku
    data_type: varchar(90)
    description: "{{ doc('column_net_suite_sku') }}"
    constraints:
    - type: not_null
  - name: sbqq_non_discountable
    data_type: boolean
    description: "{{ doc('column_sbqq_non_discountable') }}"
    constraints:
    - type: not_null
  - name: price_dimensions
    data_type: varchar(765)
    description: "{{ doc('column_price_dimensions') }}"
    constraints:
    - type: not_null
  - name: sbqq_price_editable
    data_type: boolean
    description: "{{ doc('column_sbqq_price_editable') }}"
    constraints:
    - type: not_null
  - name: sbqq_pricing_method
    data_type: varchar(765)
    description: "{{ doc('column_sbqq_pricing_method') }}"
    constraints:
    - type: not_null
  - name: sfdc_product_code
    data_type: varchar(765)
    description: "{{ doc('column_sfdc_product_code') }}"
    constraints:
    - type: not_null
  - name: sfdc_product_description
    data_type: varchar(4000)
    description: "{{ doc('column_sfdc_product_description') }}"
    constraints:
    - type: not_null
  - name: sfdc_product_family
    data_type: varchar(765)
    description: "{{ doc('column_sfdc_product_family') }}"
    constraints:
    - type: not_null
  - name: sfdc_product_sub_family
    data_type: varchar(765)
    description: "{{ doc('column_sfdc_product_sub_family') }}"
    constraints:
    - type: not_null
  - name: sbqq_quantity_editable
    data_type: boolean
    description: "{{ doc('column_sbqq_quantity_editable') }}"
    constraints:
    - type: not_null
  - name: sbqq_subscription_term
    data_type: double precision
    description: "{{ doc('column_sbqq_subscription_term') }}"
    constraints:
    - type: not_null
  - name: sbqq_subscription_type
    data_type: varchar(765)
    description: "{{ doc('column_sbqq_subscription_type') }}"
    constraints:
    - type: not_null
  - name: loaddate
    data_type: timestamp
    description: "{{ doc('column_loaddate') }}"
    constraints:
    - type: not_null
