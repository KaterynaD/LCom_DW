version: 2
models:
- name: dim_lcom_sku
  description: LCom SKU (Product) Dimension Table
  config:
    contract:
      enforced: true
    tags:
      - dim
  columns:
    - name: sku_id
      data_type: varchar(50)
      description: Unique SKU identifier
      constraints:
        - type: not_null
        - type: primary_key
          warn_unenforced: false
      data_tests:
        - unique

    - name: product_name
      data_type: varchar(200)
      description: Name of the product. All SKU name ilike EasyTech are "EasyTech" and EasyCode are "EasyCode", not Product Name from the source system
      constraints:
        - type: not_null

    - name: subproduct_name
      data_type: varchar(200)
      description: Name of the subproduct. (Online Safety)
      constraints:
        - type: not_null        

    - name: sku_name
      data_type: varchar(150)
      description: Name of the SKU
      constraints:
        - type: not_null

    - name: sku_prefix
      data_type: varchar(100)
      description: Prefix identifier of the SKU
      constraints:
        - type: not_null

    - name: sku_description
      data_type: varchar(1100)
      description: Detailed description of the SKU
      constraints:
        - type: not_null

    - name: parent_sku_id
      data_type: varchar(100)
      description: ID of the parent SKU
      constraints:
        - type: not_null

    - name: parent_sku_name
      data_type: varchar(150)
      description: Name of the parent SKU
      constraints:
        - type: not_null

    - name: sku_msaid
      data_type: integer
      description: Internal MSA identifier for the SKU
      constraints:
        - type: not_null

    - name: sku_stem
      data_type: varchar(100)
      description: Stem value of the SKU
      constraints:
        - type: not_null

    - name: is_hosted
      data_type: boolean
      description: Inadicates if the SKU is hosted
      constraints:
        - type: not_null

    - name: is_active
      data_type: boolean
      description: Indicates if the SKU is active
      constraints:
        - type: not_null

    - name: is_valid
      data_type: boolean
      description: Indicates if the SKU is valid
      constraints:
        - type: not_null

    - name: auditcreatedate
      data_type: timestamp
      description: Record creation PST timestamp in the source system
      constraints:
        - type: not_null

    - name: auditupdatedate
      data_type: timestamp
      description: Record last update PST timestamp in the source system
      constraints:
        - type: not_null
    - name: loaddate
      data_type: timestamp
      description: The datetime the record was loaded (PST)
      constraints:
        - type: not_null        