    description: Fiscal - Title I Percentage
    constraints:
    - type: not_null
  - name: sfdc_fiscal_title_i_school
    data_type: varchar(780)
    description: Fiscal - Title I School (This is the appropriated district Title
      I funding that is based on the Title I population of a school)
    constraints:
    - type: not_null
  - name: sfdc_fiscal_title_i_school_yes_no
    data_type: varchar(780)
    description: Fiscal - Title I School - Yes No
    constraints:
    - type: not_null
  - name: sfdc_fiscal_title_i_schoolwide
    data_type: varchar(780)
    description: Fiscal - Title I Schoolwide
    constraints:
    - type: not_null
  - name: sfdc_fiscal_title_i_schoolwide_yes_no
    data_type: varchar(780)
    description: Fiscal - Title I Schoolwide - Yes No
    constraints:
    - type: not_null
  - name: sfdc_free_lunch_students
    data_type: varchar(780)
    description: Free Lunch Students
