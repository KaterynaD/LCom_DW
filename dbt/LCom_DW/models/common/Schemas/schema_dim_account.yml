    description: '5th Grade Enrollment (Integrations: Gainsight.)'
    constraints:
    - type: not_null
  - name: sfdc_first_grade_enrollment
    data_type: double precision
    description: '1st Grade Enrollment (Integrations: Gainsight.)'
