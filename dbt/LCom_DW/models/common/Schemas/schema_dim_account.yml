  columns:
  - name: account_id
    data_type: varchar(300)
    description: Primary and Distribution Key of DIM_ACCOUNT It's organization_id
      (school or district) or Salesforce Id if not available in LCom Platform. The
      PK in DIM_ACCOUNT is changed from Salesforce Account Id to LCOM Organization
      Id when 2 entities are joined. DIM_ACCOUNT is re-created each time (Table materialization).
      Account_Id represents the lowest available reporting level for the record.
      It might be  a school, district, customer, or another organization level depending on the source data.
      It serves as the lowest level of the standardized reporting hierarchy.
    constraints:
    - type: not_null
    - type: primary_key
      warn_unenforced: false
    data_tests:
    - unique
  - name: name
    data_type: varchar(780)
    description: "{{ doc('column_dim_account_name') }}"
    constraints:
