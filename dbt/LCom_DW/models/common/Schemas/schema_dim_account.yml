    description: District Total TAM (Total TAM for a district based on sum of all
      children ET and EC TAM values. Source values for EC and ET are populated by
      Gainsight rule)
    constraints:
    - type: not_null
  - name: sfdc_district_type
    data_type: varchar(780)
    description: District Type (This field is mapped and will sync with Agile/ConnectLink)
    constraints:
    - type: not_null
  - name: sfdc_dq_opportunities
    data_type: bigint
    description: DQ - Opportunities (Roll up summary of all opportunities on the account)
    constraints:
    - type: not_null
  - name: sfdc_easy_tech_customer
    data_type: boolean
    description: 'EasyTech Customer (Converts the Number of EasyTech Subscriptions
      field into a binary field  Integrations: Gainsight.)'
    constraints:
    - type: not_null
  - name: sfdc_easy_tech_tam
    data_type: numeric(35,10)
    description: EasyTech TAM (Contains the estimated size of the EasyTech opportunity
      based on current pricing. This field is populated manually via dataloader once
      per year. This TAM only includes TAM for K-8 Enrollment as of November 2022.)
    constraints:
    - type: not_null
  - name: sfdc_easy_tech_tam_captured
    data_type: double precision
    description: EasyTech TAM Captured (Ratio between Total Renewal ARR and total
      EasyTech TAM. This field is used to assign the sales owner based on the 33%
      threshold established during sales planning in November 2022)
    constraints:
    - type: not_null
  - name: sfdc_ec_tam
    data_type: double precision
    description: EC TAM (Calculates TAM for EasyCode (using just Codesters))
    constraints:
