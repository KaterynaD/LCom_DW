    constraints:
    - type: not_null
  - name: sfdc_fiscal_career_and_tech_state
    data_type: varchar(780)
    description: Fiscal - Career and Tech - State
    constraints:
    - type: not_null
  - name: sfdc_fiscal_career_and_tech_teacher_salar
    data_type: varchar(780)
    description: Fiscal - Career and Tech - Teacher Salar
    constraints:
    - type: not_null
  - name: sfdc_fiscal_title_i_eligible_school
    data_type: varchar(780)
    description: Fiscal - Title I Eligible School
    constraints:
    - type: not_null
  - name: sfdc_fiscal_title_i_funding
