version: 2
models:
- name: dim_account
  description: Conformed DIM_ACCOUNT dimension. Account (districts and schools) data
    from all systems
  config:
    contract:
      enforced: true
    tags:
    - dim
  columns:
  - name: account_id
    data_type: varchar(300)
    description: Primary and Distribution Key of DIM_ACCOUNT. It's organization_id
      (school or district) or Salesforce Id if not available in LCom Platform. The PK in DIM_ACCOUNT is changed from Salesforce Account Id to LCOM Organization Id when 2 entities are joined. DIM_ACCOUNT is re-created each time (Table materialization).
    constraints:
    - type: not_null
    - type: primary_key
      warn_unenforced: false
    data_tests:
    - unique
  - name: lcom_organization_id
    data_type: varchar(300)
    description: LCOM Organization ID Can be skew with default values if an account
      does not exist in LCOM Platform. Can be used in joins with LCOM related tables
      but better use account_id because it's a distribution key
    constraints:
    - type: not_null
  - name: lcom_organization_name
    data_type: varchar(270)
    description: LCOM Organization Name
    constraints:
    - type: not_null
  - name: lcom_organization_type
    data_type: varchar(270)
    description: LCOM Organization Type (school or district)
    constraints:
    - type: not_null
  - name: lcom_parent_organization_id
    data_type: varchar(270)
    description: LCOM Parent Organization Id (district Id)
    constraints:
    - type: not_null
  - name: lcom_parent_organization_name
    data_type: varchar(270)
    description: LCOM Parent Organization Name (district name)
    constraints:
    - type: not_null
  - name: lcom_trial
    data_type: boolean
    description: Trial use of LCOM products
    constraints:
    - type: not_null
  - name: lcom_demo
    data_type: boolean
    description: Demo use of LCOM products
    constraints:
    - type: not_null
  - name: lcom_postal_code
    data_type: varchar(20)
    constraints:
    - type: not_null
  - name: lcom_state_province_key
    data_type: varchar(20)
    constraints:
    - type: not_null
  - name: lcom_state_province_code
    data_type: varchar(20)
    constraints:
    - type: not_null
  - name: lcom_state_province_name
    data_type: varchar(50)
    constraints:
    - type: not_null
  - name: lcom_country_code
    data_type: varchar(20)
    constraints:
    - type: not_null
  - name: lcom_country_name
    data_type: varchar(70)
    constraints:
    - type: not_null
  - name: lcom_alpha3_code
    data_type: varchar(20)
    constraints:
    - type: not_null
  - name: lcom_numeric_code
    data_type: varchar(20)
    constraints:
    - type: not_null
  - name: lcom_external_sis_id
    data_type: varchar(270)
    constraints:
    - type: not_null
  - name: lcom_nces_id
    data_type: varchar(30)
    constraints:
    - type: not_null
  - name: lcom_created_datetime
    data_type: timestamp
    constraints:
    - type: not_null
  - name: lcom_modified_datetime
    data_type: timestamp
    constraints:
    - type: not_null
  - name: lcom_deleted_datetime
    data_type: timestamp
    constraints:
    - type: not_null
  - name: sfdc_account_id
    data_type: varchar(300)
    description: Salesforce Account ID. It's unique Salesforce Account Id. If there
      are more then one LCom Organization related to teh same account, there is `dup-`prefix
      in the value. It's possible to have more then one Salesforce Id with `dup-'
      prefix added, but `clean` Salesforce Id is unique and safe to be used in the
      joins. Use account_id in joins because it's a distribution key.
    constraints:
    - type: not_null
    data_tests:
    - unique:
        where: left(SFDC_account_id,4) != 'dup-' and SFDC_account_id!='{{ var('default_varchar')
          }}'
  - name: sfdc_name
    data_type: varchar(780)
    description: Account Name
    constraints:
    - type: not_null
  - name: sfdc_account_last_activity_date
    data_type: date
    description: Account Last Activity Date
    constraints:
    - type: not_null
  - name: sfdc_account_lifecycle_stage
    data_type: varchar(780)
    description: Account Lifecycle Stage
    constraints:
    - type: not_null
  - name: sfdc_account_management_type
    data_type: varchar(20)
    description: Account Management Type
    constraints:
    - type: not_null
  - name: sfdc_act_id
    data_type: varchar(30)
    description: act id
    constraints:
    - type: not_null
  - name: sfdc_actively_prospecting
    data_type: boolean
    description: Actively Prospecting (Mark if this is a customer you are actively
      prospecting but not yet at an opportunity stage)
    constraints:
    - type: not_null
  - name: sfdc_activity_metric_id
    data_type: varchar(30)
    description: Activity Metric
    constraints:
    - type: not_null
  - name: sfdc_activity_metric_rollup_id
    data_type: varchar(30)
    description: Activity Metric Rollup
    constraints:
    - type: not_null
  - name: sfdc_ae_or_isr
    data_type: varchar(20)
    description: AE OR ISR
    constraints:
    - type: not_null
  - name: sfdc_agile_id
    data_type: varchar(70)
    description: Agile ID
    constraints:
    - type: not_null
  - name: sfdc_agile_lms
    data_type: varchar(4110)
    description: Agile LMS (Agile LMS)
    constraints:
    - type: not_null
  - name: sfdc_agileed_agile_ed_insert
    data_type: boolean
    description: Created By ConnectLink
    constraints:
    - type: not_null
  - name: sfdc_agileed_agile_ed_key
    data_type: varchar(40)
    description: ConnectLink Key
    constraints:
    - type: not_null
  - name: sfdc_agileed_agile_ed_latest_update_date
    data_type: date
    description: ConnectLink Latest Update Date
    constraints:
    - type: not_null
  - name: sfdc_agileed_agile_ed_parent_key
    data_type: varchar(40)
    description: ConnectLink Parent Key
    constraints:
    - type: not_null
  - name: sfdc_agileed_agile_ed_status
    data_type: varchar(90)
    description: 'ConnectLink Status (The status of the record in the Agile-Ed database:
      A = Active, C = Closed, U = Unlicensed.)'
    constraints:
    - type: not_null
  - name: sfdc_agileed_agile_ed_up_to_date
    data_type: boolean
    description: ConnectLink Up To Date (Deprecated)
    constraints:
    - type: not_null
  - name: sfdc_agileed_agileed_do_not_update
    data_type: boolean
    description: ConnectLink Do Not Update (If this field is checked, then only the
      record's ConnectLink Status and ConnectLink Last Sync fields wil be updated
      when the record is synced.)
    constraints:
    - type: not_null
  - name: sfdc_agileed_connect_link_changed_personnel_titles
    data_type: double precision
    description: ConnectLink Changed Personnel Titles (The number of changed Personnel
      ConnectLink Titles under the Institution.)
    constraints:
    - type: not_null
  - name: sfdc_agileed_connect_link_district_key
    data_type: varchar(40)
    description: ConnectLink District Key
    constraints:
    - type: not_null
  - name: sfdc_agileed_connect_link_file_type
    data_type: varchar(250)
    description: ConnectLink File Type (The category of the Institution.)
    constraints:
    - type: not_null
  - name: sfdc_agileed_connect_link_hierarchized_personnel
    data_type: double precision
    description: ConnectLink Hierarchized Personnel (The number of Personnel associated
      to the Institution by ConnectLink.)
    constraints:
    - type: not_null
  - name: sfdc_agileed_connect_link_licensed_status
    data_type: varchar(70)
    description: ConnectLink Licensed Status
    constraints:
    - type: not_null
  - name: sfdc_agileed_connect_link_personnel_roles
    data_type: double precision
    description: ConnectLink Personnel Roles (The number of Personnel ConnectLink
      Roles under the Institution.)
    constraints:
    - type: not_null
  - name: sfdc_agileed_connect_link_personnel_titles
    data_type: double precision
    description: ConnectLink Personnel Titles (The number of Personnel ConnectLink
      Titles under the Institution.)
    constraints:
    - type: not_null
  - name: sfdc_agileed_last_sync
    data_type: timestamp
    description: ConnectLink Last Sync Date
    constraints:
    - type: not_null
  - name: sfdc_agileed_parent_pending
    data_type: boolean
    description: ConnectLink Parent Pending (If true, the parent record has not yet
      been inserted to create a hierarchy. Used in batch job to signal the need for
      parenting.)
    constraints:
    - type: not_null
  - name: sfdc_agileed_personnel_last_sync
    data_type: timestamp
    description: ConnectLink Personnel Last Sync (Timestamped after Contacts and/or
      Leads directly related to the Account are bulk-updated.)
    constraints:
    - type: not_null
  - name: sfdc_alt_phone
    data_type: varchar(130)
    description: Agile Phone
    constraints:
    - type: not_null
  - name: sfdc_cares_act_allocation
    data_type: double precision
    description: CARES Act Allocation
    constraints:
    - type: not_null
  - name: sfdc_category
    data_type: varchar(780)
    description: Category
    constraints:
    - type: not_null
  - name: sfdc_closed_district_tx_adoption
    data_type: boolean
    description: Closed District - TX Adoption (If checked, the district is a known
      closed district and can not be prospected outside of the IMA coordinator.)
    constraints:
    - type: not_null
  - name: sfdc_code_monkey_customer
    data_type: boolean
    description: 'Code Monkey Customer (Converts the Number of Active Code Monkey
      Subscriptions field into a checkbox  Integrations: Gainsight.)'
    constraints:
    - type: not_null
  - name: sfdc_codester_id
    data_type: varchar(70)
    description: CodesterID
    constraints:
    - type: not_null
  - name: sfdc_codesters_account_to_be_migrated_to_prod
    data_type: boolean
    description: Codesters Account to be Migrated to Prod (Denotes if a Codesters
      account has been flagged to be migrated to prod.)
    constraints:
    - type: not_null
  - name: sfdc_codesters_customer_2
    data_type: boolean
    description: 'Codesters Customer (Converts the Number of Active Codesters Subscriptions
      field into a checkbox  Integrations: Gainsight.)'
    constraints:
    - type: not_null
  - name: sfdc_codesters_customer_dedupe_flag
    data_type: boolean
    description: Codesters Customer Dedupe Flag (Denotes if an account has been flagged
      as an active customer and should be prioritized for dedupe during migration.
      This field should not be migrated to prod and should be deprecated after the
      migration is complete (will happen automatically after sandbox refresh))
    constraints:
    - type: not_null
  - name: sfdc_company_domain_name
    data_type: varchar(780)
    description: Company Domain Name (Field that integrates with Hubspot for means
      of company identification and automatic contact association within Hubspot)
    constraints:
    - type: not_null
  - name: sfdc_completed_onboarding
    data_type: boolean
    description: Completed Onboarding (Describes whether or not a new account has
      been onboarded.)
    constraints:
    - type: not_null
  - name: sfdc_computer_os
    data_type: varchar(780)
    description: Computer OS
    constraints:
    - type: not_null
  - name: sfdc_contracted_roll_up
    data_type: numeric(35,10)
    description: Contracted Roll Up
    constraints:
    - type: not_null
  - name: sfdc_county_name
    data_type: varchar(780)
    description: 'County Name (Integrations: Gainsight.)'
    constraints:
    - type: not_null
  - name: sfdc_created_by_id
    data_type: varchar(30)
    description: Created By
    constraints:
    - type: not_null
  - name: sfdc_created_date
    data_type: timestamp
    description: Created Date in PST
    constraints:
    - type: not_null
  - name: sfdc_csm_email
    data_type: varchar(400)
    description: CSM Email
    constraints:
    - type: not_null
  - name: sfdc_csm_name
    data_type: varchar(380)
    description: CSM Name
    constraints:
    - type: not_null
  - name: sfdc_current_renewal_arr
    data_type: numeric(35,10)
    description: 'Current Renewal ARR (Integrations: Gainsight.)'
    constraints:
    - type: not_null
  - name: sfdc_current_total_ultimate_parent
    data_type: varchar(410)
    description: Current / Total / Ultimate Parent (Combined ARR Renewal values. A
      field which converts three currency fields (Current Renewal ARR, Total Renewal
      ARR, Ultimate Parent Total Renewal ARR) into text and concat them into one custom,
      text formula field. For Sys Admins and Sales Support)
    constraints:
    - type: not_null
  - name: sfdc_customer_type
    data_type: varchar(20)
    description: 'Customer Type (Creates text value for Record Type field for easier
      user understanding  Integrations: Gainsight.)'
    constraints:
    - type: not_null
  - name: sfdc_data_quality_description
    data_type: varchar(70)
    description: Data Quality Description
    constraints:
    - type: not_null
  - name: sfdc_data_quality_score
    data_type: integer
    description: Data Quality Score
    constraints:
    - type: not_null
  - name: sfdc_de_identified_district
    data_type: boolean
    description: DeIdentified District?
    constraints:
    - type: not_null
  - name: sfdc_description
    data_type: varchar(max)
    description: 'Description (Integrations: Gainsight.)'
    constraints:
    - type: not_null
  - name: sfdc_detailed_grade
    data_type: varchar(780)
    description: Detailed Grade
    constraints:
    - type: not_null
  - name: sfdc_district
    data_type: varchar(780)
    description: District Segment Size (to be populated by rule looking at enrollment)
    constraints:
    - type: not_null
  - name: sfdc_district_easy_code_tam
    data_type: numeric(35,10)
    description: District EasyCode TAM (Total EasyCode TAM for a district based on
      sum of all children TAM values)
    constraints:
    - type: not_null
  - name: sfdc_district_easy_tech_tam
    data_type: numeric(35,10)
    description: 'District EasyTech TAM (Total EasyTech TAM for a district based on
      sum of all children TAM values  Integrations: Gainsight.)'
    constraints:
    - type: not_null
  - name: sfdc_district_elementary_teachers
    data_type: varchar(110)
    description: District Elementary Teachers
    constraints:
    - type: not_null
  - name: sfdc_district_enrollment
