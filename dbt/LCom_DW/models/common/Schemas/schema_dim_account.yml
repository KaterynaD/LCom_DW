    description: 'District Enrollment (Integrations: Gainsight.)'
    constraints:
    - type: not_null
  - name: sfdc_district_expansion_potential
    data_type: numeric(35,10)
    description: District Expansion Potential (If Total TAM is greater than current
      renewal ARR, display the delta, else display zero. System estimated upsell potential.
      Meant as a guideline only.)
    constraints:
    - type: not_null
  - name: sfdc_district_faculty_library_media_fte
    data_type: double precision
    description: District Faculty - Library/Media FTE
    constraints:
    - type: not_null
  - name: sfdc_district_instructional_expenditures
    data_type: varchar(310)
    description: District Instructional Expenditures
    constraints:
    - type: not_null
  - name: sfdc_district_k_8_enrollment
    data_type: double precision
    description: District K-8 Enrollment
    constraints:
    - type: not_null
  - name: sfdc_district_kindergarten_teachers
    data_type: varchar(110)
    description: District Kindergarten Teachers
    constraints:
    - type: not_null
  - name: sfdc_district_local_revenue_cities
    data_type: double precision
    description: District Local Revenue Cities (Local revenue from cities and counties.)
    constraints:
    - type: not_null
  - name: sfdc_district_local_revenue_other_leas
    data_type: varchar(70)
    description: District Local Revenue Other LEAs (Local revenue from other school
      systems.)
    constraints:
    - type: not_null
  - name: sfdc_district_local_revenue_other_taxes
    data_type: varchar(70)
    description: District Local Revenue Other Taxes (Local revenue all other taxes.)
    constraints:
    - type: not_null
  - name: sfdc_district_local_revenue_property_taxes
    data_type: varchar(70)
    description: District Local Revenue Property Taxes (Local revenue from property
      taxes.)
    constraints:
    - type: not_null
  - name: sfdc_district_nces
    data_type: varchar(780)
    description: District NCES
    constraints:
    - type: not_null
  - name: sfdc_district_presence
    data_type: double precision
    description: District Presence (Denotes, in percent, the number of provisioned
      buildings against the number of total buildings in the district.)
    constraints:
    - type: not_null
  - name: sfdc_district_state_initiative
    data_type: boolean
    description: District State Initiative
    constraints:
    - type: not_null
  - name: sfdc_district_total_capital_outlay
    data_type: varchar(780)
