services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  airflow-webserver:
    build: .
    image: airflow-dbt:2.10.2-py3.12
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /home/kdrogaieva/airflow_env/.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/releases/current/transformations/airflow/dags
      AIRFLOW__SMTP__SMTP_HOST: "email-smtp.us-west-2.amazonaws.com"
      AIRFLOW__SMTP__SMTP_STARTTLS: "True"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__SMTP__SMTP_PORT: "587"
      AIRFLOW__SMTP__SMTP_MAIL_FROM: "kdrogaieva@learning.com"
      AIRFLOW__SMTP__SMTP_USER: "AKIATT2JL77I26VH5X7R"
      AIRFLOW__SMTP__SMTP_PASSWORD_CMD: cat /opt/airflow_secrets/.smtp_password




      # dbt location inside container
      DBT_PROFILES_DIR: /home/airflow/.dbt
      DBT_LCOM_DW_PROJECT_DIR: /opt/airflow/releases/current/transformations/dbt/LCom_DW
      DBT_TARGET_PATH: /home/airflow/dbt_target
      DBT_LOG_PATH: /home/airflow/dbt_logs   

      # repo
      REPO_DIR: /opt/airflow/releases/current/transformations

    volumes:
      # Airflow runtime stuff
      - /home/kdrogaieva/airflow_logs:/opt/airflow/logs
      - /home/kdrogaieva/airflow_plugins:/opt/airflow/plugins
      - /home/kdrogaieva/dbt_profile:/home/airflow/.dbt
      - /home/kdrogaieva/releases:/opt/airflow/releases
      - /home/kdrogaieva/.ssh:/root/.ssh:ro
      - /home/kdrogaieva/airflow_env:/opt/airflow_secrets:ro
      - /home/kdrogaieva/dbt_target:/home/airflow/dbt_target
      - /home/kdrogaieva/dbt_logs:/home/airflow/dbt_logs 

    
    ports:
      - "8080:8080"


    # Healthcheck for Airflow webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

    command:
    - bash
    - -c
    - |
        echo ">>> Bootstrapping Airflow Variable ALERT_EMAIL..."

        # Create Variable only if missing
        # ----------------------------------------
        # ALERT_EMAIL
        # ----------------------------------------
         if ! airflow variables get ALERT_EMAIL >/dev/null 2>&1; then
          airflow variables set ALERT_EMAIL "kdrogaieva@learning.com"
          echo "Variable ALERT_EMAIL created: kdrogaieva@learning.com"
        else
          echo "Variable ALERT_EMAIL already exists — skipping."
        fi

        # ----------------------------------------
        # INIT_DBT_PROJECT (YES by default)
        # This will be changed to NO by CI/CD pipeline later.
        # ----------------------------------------
        if ! airflow variables get INIT_DBT_PROJECT >/dev/null 2>&1; then
          airflow variables set INIT_DBT_PROJECT "NO"
          echo "Variable INIT_DBT_PROJECT created: NO"
        else
          echo "Variable INIT_DBT_PROJECT already exists — skipping."
        fi



        echo ">>> Starting Airflow Webserver..."
        exec airflow webserver

  airflow-scheduler:
    image: airflow-dbt:2.10.2-py3.12
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /home/kdrogaieva/airflow_env/.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/releases/current/transformations/airflow/dags
      AIRFLOW__SMTP__SMTP_HOST: "email-smtp.us-west-2.amazonaws.com"
      AIRFLOW__SMTP__SMTP_STARTTLS: "True"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__SMTP__SMTP_PORT: "587"
      AIRFLOW__SMTP__SMTP_MAIL_FROM: "kdrogaieva@learning.com"
      AIRFLOW__SMTP__SMTP_USER: "AKIATT2JL77I26VH5X7R"
      AIRFLOW__SMTP__SMTP_PASSWORD_CMD: cat /opt/airflow_secrets/.smtp_password

      REPO_DIR:  /opt/airflow/releases/current/transformations

      # dbt location inside container
      DBT_PROFILES_DIR: /home/airflow/.dbt
      DBT_LCOM_DW_PROJECT_DIR: /opt/airflow/releases/current/transformations/dbt/LCom_DW
      DBT_TARGET_PATH: /home/airflow/dbt_target
      DBT_LOG_PATH: /home/airflow/dbt_logs  

    volumes:
      - /home/kdrogaieva/airflow_logs:/opt/airflow/logs
      - /home/kdrogaieva/airflow_plugins:/opt/airflow/plugins
      - /home/kdrogaieva/dbt_profile:/home/airflow/.dbt
      - /home/kdrogaieva/releases:/opt/airflow/releases
      - /home/kdrogaieva/.ssh:/root/.ssh:ro
      - /home/kdrogaieva/airflow_env:/opt/airflow_secrets:ro
      - /home/kdrogaieva/dbt_target:/home/airflow/dbt_target
      - /home/kdrogaieva/dbt_logs:/home/airflow/dbt_logs      

    command: scheduler

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'airflow scheduler' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-init:
    image: airflow-dbt:2.10.2-py3.12
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /home/kdrogaieva/airflow_env/.env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      # dbt location inside container
      DBT_PROFILES_DIR: /home/airflow/.dbt
      DBT_LCOM_DW_PROJECT_DIR: /opt/airflow/releases/current/transformations/dbt/LCom_DW
      DBT_TARGET_PATH: /home/airflow/dbt_target
      DBT_LOG_PATH: /home/airflow/dbt_logs   

      # repo
      REPO_DIR:  /opt/airflow/releases/current/transformations



    volumes:
      - /home/kdrogaieva/airflow_logs:/opt/airflow/logs
      - /home/kdrogaieva/airflow_plugins:/opt/airflow/plugins
      - /home/kdrogaieva/dbt_profile:/home/airflow/.dbt
      - /home/kdrogaieva/releases:/opt/airflow/releases
      - /home/kdrogaieva/.ssh:/root/.ssh:ro
      - /home/kdrogaieva/airflow_env:/opt/airflow_secrets:ro
      - /home/kdrogaieva/dbt_target:/home/airflow/dbt_target
      - /home/kdrogaieva/dbt_logs:/home/airflow/dbt_logs 
    command:
      - bash
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname Kate --lastname Drogaieva --role Admin --email kdrogaieva@learning.com || true"

