name: Deploy to EC2 AWSPRDDWH001

on:
  push:
    branches:
      - qa
  workflow_dispatch:

env:
  DEPLOY_SCRIPT: /home/kdrogaieva/Prod/deploy/bin/deploy_release_from_actions.sh
  PROMOTE_SCRIPT: /home/kdrogaieva/Prod/deploy/bin/promote_validated_qa_to_master.sh

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Show deployment context
        shell: bash
        run: |
          echo "Deploy script  : $DEPLOY_SCRIPT"
          echo "Promote script : $PROMOTE_SCRIPT"
          echo "Branch         : $GITHUB_REF_NAME"
          echo "SHA            : $GITHUB_SHA"

      - name: Promote validated QA to master
        shell: bash
        run: |
          "$PROMOTE_SCRIPT"          

      - name: Deploy and test QA
        shell: bash
        run: |
          "$DEPLOY_SCRIPT" \
            "$GITHUB_SHA" \
            "$GITHUB_REF_NAME"

