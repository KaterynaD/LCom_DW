name: Self-hosted runner – minimal test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Prove runner works
        shell: bash
        env:
          REDSHIFT_HOST: ${{ secrets.REDSHIFT_HOST }}        
        run: |        
          echo "✅ Runner is alive"
          echo "REDSHIFT_HOST=$REDSHIFT_HOST"
          echo "Runner labels: $RUNNER_LABELS"
          echo "User: $(whoami)"
          echo "Host: $(hostname)"
          echo "Time: $(date -Is)"
          echo "Working dir: $(pwd)"
